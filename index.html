function base64ToUint8Array(base64){
  const binStr = atob(base64);
  const bytes = new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++) bytes[i] = binStr.charCodeAt(i);
  return bytes;
}

function xmlEscape(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

// 값이 있으면 inlineStr로 채우고, 없으면 스타일만 유지한 빈 셀을 만든다
function xCell(ref, style, value){
  const v = (value===undefined || value===null) ? '' : String(value);
  if(v === '') return `<c r="${ref}" s="${style}"/>`;
  return `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(v)}</t></is></c>`;
}

const COL_LETTERS = ['A','B','C','D','E','F','G','H','I','J','K','L','M'];

// 시트의 행 구성(데이터 시작/끝 행, 비고 박스 행 등)을 계산.
// buildSheetXml과 buildWorkbookBlob(빗금 그리기)에서 공통으로 사용.
function computeSheetLayout(sheet){
  const rows = sheet.rows.length >= DAYS_MIN_ROWS
    ? sheet.rows
    : [...sheet.rows, ...Array.from({length: DAYS_MIN_ROWS - sheet.rows.length}, blankRow)];

  const dataStartRow = 5;                       // 1-indexed, 첫 데이터 행
  const dataEndRow = dataStartRow + rows.length - 1;
  const footerLabelRow = dataEndRow + 1;
  const footerEndRow = footerLabelRow + 1;       // 비고/담당자/승인자 박스 (2행)
  const infoRow = footerEndRow + 1;              // ISO 문서번호 / 페이지 표시 행
  const totalRows = infoRow;

  return { rows, dataStartRow, dataEndRow, footerLabelRow, footerEndRow, infoRow, totalRows };
}

// 데이터 행에 실제로 입력된 값이 하나라도 있는지 확인
function rowHasData(r){
  return !!(r && (r.date || r.timeStart || r.timeEnd || r.mfgNo || r.process || r.worker || r.checker || r.note));
}

// 입력된 값이 있는 마지막 행의 인덱스(0-based). 하나도 없으면 -1.
function lastFilledRowIndex(rows){
  let idx = -1;
  rows.forEach((r,i)=>{ if(rowHasData(r)) idx = i; });
  return idx;
}

function buildSheetXml(sheet){
  const { rows, dataStartRow, dataEndRow, footerLabelRow, footerEndRow, infoRow, totalRows } = computeSheetLayout(sheet);

  const deviceText = sheet.device || '';

  const rowsXml = [];

  // 1행: 제목
  rowsXml.push(`<row r="1" spans="1:13" ht="24.95" customHeight="1" x14ac:dyDescent="0.3">`
    + xCell('A1','7','기기가동기록서')
    + COL_LETTERS.slice(1).map(c=>xCell(`${c}1`,'7','')).join('')
    + `</row>`);

  // 2행: 년/월
  rowsXml.push(`<row r="2" spans="1:13" s="11" customFormat="1" ht="17.25" customHeight="1" x14ac:dyDescent="0.3">`
    + xCell('A2','15', `${sheet.year||''}년 ${sheet.month ? String(sheet.month).padStart(2,'0') : ''}월`)
    + COL_LETTERS.slice(1,-1).map(c=>xCell(`${c}2`,'16','')).join('')
    + xCell('M2','17','')
    + `</row>`);

  // 3행: 기기명 / 설치장소
  rowsXml.push(`<row r="3" spans="1:13" s="11" customFormat="1" ht="17.25" customHeight="1" x14ac:dyDescent="0.3">`
    + xCell('A3','18', `기기명 ${deviceText}`)
    + xCell('B3','18','') + xCell('C3','18','') + xCell('D3','18','') + xCell('E3','18','')
    + xCell('F3','18','설치장소')
    + xCell('G3','18','') + xCell('H3','18','') + xCell('I3','18','')
    + xCell('J3','18', sheet.location || '')
    + xCell('K3','18','') + xCell('L3','18','') + xCell('M3','18','')
    + `</row>`);

  // 4행: 표 머리글
  rowsXml.push(`<row r="4" spans="1:13" ht="17.25" customHeight="1" x14ac:dyDescent="0.3">`
    + xCell('A4','3','날짜')
    + xCell('B4','3','사용시간')
    + xCell('C4','2','제조번호')
    + xCell('D4','2','')
    + xCell('E4','3','작업공정')
    + xCell('F4','3','작업자')
    + xCell('G4','3','확인자')
    + xCell('H4','4','비고')
    + xCell('I4','5','') + xCell('J4','5','') + xCell('K4','5','') + xCell('L4','5','')
    + xCell('M4','6','')
    + `</row>`);

  // 데이터 행
  rows.forEach((r, i)=>{
    const rn = dataStartRow + i;
    const timeRange = (r.timeStart || r.timeEnd)
      ? `${r.timeStart||''}${(r.timeStart&&r.timeEnd)?'~':''}${r.timeEnd||''}`
      : '';
    rowsXml.push(`<row r="${rn}" spans="1:13" ht="${DATA_ROW_HEIGHT}" customHeight="1" x14ac:dyDescent="0.3">`
      + xCell(`A${rn}`,'2', r.date || '')
      + xCell(`B${rn}`,'13', timeRange)
      + xCell(`C${rn}`,'13', r.mfgNo || '')
      + xCell(`D${rn}`,'13','')
      + xCell(`E${rn}`,'13', r.process || '')
      + xCell(`F${rn}`,'13', r.worker ? displayName(r.worker) : '')
      + xCell(`G${rn}`,'13', r.checker ? displayName(r.checker) : '')
      + xCell(`H${rn}`,'13', r.note || '')
      + xCell(`I${rn}`,'13','') + xCell(`J${rn}`,'13','') + xCell(`K${rn}`,'13','')
      + xCell(`L${rn}`,'13','') + xCell(`M${rn}`,'13','')
      + `</row>`);
  });

  // 하단: 비고 / 담당자 / 승인자 (2행 병합)
  const managerName = sheet.manager ? displayName(sheet.manager) : '';
  const approverName = sheet.approver ? displayName(sheet.approver) : '';
  rowsXml.push(`<row r="${footerLabelRow}" spans="1:13" x14ac:dyDescent="0.3">`
    + xCell(`A${footerLabelRow}`,'2','비고')
    + xCell(`B${footerLabelRow}`,'2', sheet.footerNote || '')
    + xCell(`C${footerLabelRow}`,'2','') + xCell(`D${footerLabelRow}`,'2','')
    + xCell(`E${footerLabelRow}`,'2','') + xCell(`F${footerLabelRow}`,'2','')
    + xCell(`G${footerLabelRow}`,'2','')
    + xCell(`H${footerLabelRow}`,'2','담당자')
    + xCell(`I${footerLabelRow}`,'2', managerName)
    + xCell(`J${footerLabelRow}`,'2','')
    + xCell(`K${footerLabelRow}`,'2','승인자')
    + xCell(`L${footerLabelRow}`,'2', approverName)
    + xCell(`M${footerLabelRow}`,'2','')
    + `</row>`);
  rowsXml.push(`<row r="${footerEndRow}" spans="1:13" x14ac:dyDescent="0.3">`
    + COL_LETTERS.map(c=>xCell(`${c}${footerEndRow}`,'2','')).join('')
    + `</row>`);
  rowsXml.push(`<row r="${infoRow}" spans="1:13" ht="18" customHeight="1" x14ac:dyDescent="0.3">`
    + xCell(`A${infoRow}`,'14','ISO-FES-001-02')
    + xCell(`B${infoRow}`,'14','') + xCell(`C${infoRow}`,'14','') + xCell(`D${infoRow}`,'14','')
    + xCell(`E${infoRow}`,'14','') + xCell(`F${infoRow}`,'14','') + xCell(`G${infoRow}`,'14','')
    + xCell(`H${infoRow}`,'14','') + xCell(`I${infoRow}`,'14','') + xCell(`J${infoRow}`,'14','')
    + xCell(`K${infoRow}`,'14','') + xCell(`L${infoRow}`,'14','')
    + xCell(`M${infoRow}`,'14','1 of 1')
    + `</row>`);

  const merges = ['A1:M1','A2:M2','A3:E3','F3:I3','J3:M3','C4:D4','H4:M4'];
  rows.forEach((r,i)=>{
    const rn = dataStartRow + i;
    merges.push(`C${rn}:D${rn}`, `H${rn}:M${rn}`);
  });
  merges.push(
    `A${footerLabelRow}:A${footerEndRow}`,
    `B${footerLabelRow}:G${footerEndRow}`,
    `H${footerLabelRow}:H${footerEndRow}`,
    `I${footerLabelRow}:J${footerEndRow}`,
    `K${footerLabelRow}:K${footerEndRow}`,
    `L${footerLabelRow}:M${footerEndRow}`,
  );

  const mergeCellsXml = `<mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`;

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" mc:Ignorable="x14ac xr xr2 xr3" xmlns:x14ac="http://schemas.microsoft.com/office/spreadsheetml/2009/9/ac" xmlns:xr="http://schemas.microsoft.com/office/spreadsheetml/2014/revision" xmlns:xr2="http://schemas.microsoft.com/office/spreadsheetml/2015/revision2" xmlns:xr3="http://schemas.microsoft.com/office/spreadsheetml/2016/revision3" xr:uid="{00000000-0001-0000-0000-000000000000}"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:M${totalRows}"/><sheetViews><sheetView tabSelected="1" view="pageBreakPreview" zoomScale="100" zoomScaleNormal="100" zoomScaleSheetLayoutView="100" workbookViewId="0"><selection activeCell="A1" sqref="A1"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="16.5" x14ac:dyDescent="0.3"/><cols><col min="1" max="1" width="14" customWidth="1"/><col min="2" max="2" width="15" customWidth="1"/><col min="3" max="4" width="7.5" customWidth="1"/><col min="5" max="5" width="10" customWidth="1"/><col min="6" max="7" width="9" customWidth="1"/><col min="8" max="13" width="10" customWidth="1"/></cols><sheetData>${rowsXml.join('')}</sheetData>${mergeCellsXml}<phoneticPr fontId="1" type="noConversion"/><printOptions horizontalCentered="1"/><pageMargins left="0.4" right="0.4" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="1"/><headerFooter differentFirst="0" scaleWithDoc="1" alignWithMargins="1"></headerFooter></worksheet>`;
}

/* ============================================================
   빈 칸 사선(빗금) 표시
   - "선택한 월 저장" 및 엑셀 다운로드 시, 입력이 끝난 부분부터
     아래쪽 빈 칸까지 대각선을 그어 이후 임의 기재를 방지한다.
   - 메인 표: 입력된 마지막 행 다음 행부터 표 맨 아래 행까지, M열 위쪽에서
     A열 아래쪽으로 대각선 하나
   - 하단 비고 박스: 비고에 입력된 내용이 없을 때만, G열 위쪽에서 B열 아래쪽으로 대각선
   - 각 날짜 행의 비고 칸(H~M): 그 행에 다른 데이터는 있는데 비고만
     비어 있으면, 그 행의 비고 칸에만 대각선
============================================================ */
// leftCol0/rightCol0/topRow0/bottomRow0: 0-based 셀 경계(드로잉 앵커 좌표)
// 대각선은 항상 "우상단 -> 좌하단" 방향이 되도록 flipH를 적용한다
function diagLineXml(shapeId, name, leftCol0, topRow0, rightCol0, bottomRow0){
  return `<xdr:twoCellAnchor editAs="oneCell">`
    + `<xdr:from><xdr:col>${leftCol0}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${topRow0}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from>`
    + `<xdr:to><xdr:col>${rightCol0}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${bottomRow0}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>`
    + `<xdr:cxnSp macro=""><xdr:nvCxnSpPr><xdr:cNvPr id="${shapeId}" name="${name}"/><xdr:cNvCxnSpPr/></xdr:nvCxnSpPr>`
    + `<xdr:spPr><a:xfrm flipH="1"><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom>`
    + `<a:ln w="9525" cap="flat"><a:solidFill><a:srgbClr val="000000"/></a:solidFill></a:ln></xdr:spPr>`
    + `</xdr:cxnSp><xdr:clientData/></xdr:twoCellAnchor>`;
}

function buildDrawingXml(shapesXml){
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${shapesXml.join('')}</xdr:wsDr>`;
}

// 시트 내용을 보고 필요한 사선 도형 XML 목록을 만든다 (없으면 빈 배열)
function buildDiagonalShapes(sheet){
  const layout = computeSheetLayout(sheet);
  const shapes = [];
  let shapeId = 2;

  const lastFilled = lastFilledRowIndex(layout.rows);
  if(lastFilled < layout.rows.length - 1){
    const diagStartRow1 = layout.dataStartRow + lastFilled + 1; // 대각선이 시작될 첫 빈 행(1-indexed)
    // 표 전체 폭(A~M) 기준, 위쪽 경계 = 빈 행 시작 지점, 아래쪽 경계 = 표 맨 아래 행
    shapes.push(diagLineXml(shapeId++, 'MainTableDiagonal', 0, diagStartRow1 - 1, 13, layout.dataEndRow));
  }

  const footerNoteFilled = !!(sheet.footerNote && String(sheet.footerNote).trim());
  if(!footerNoteFilled){
    // 비고 박스(B~G, footerLabelRow~footerEndRow) 전체에 대각선
    shapes.push(diagLineXml(shapeId++, 'RemarkBoxDiagonal', 1, layout.footerLabelRow - 1, 7, layout.footerEndRow));
  }

  // 각 날짜 행: 다른 항목은 입력되어 있는데 비고만 비어 있으면,
  // 그 행의 비고 칸(H~M)에만 대각선을 긋는다 (행 전체가 비어 있으면
  // 이미 위의 MainTableDiagonal이 그 행을 덮으므로 중복 처리하지 않음)
  layout.rows.forEach((r, i)=>{
    if(!rowHasData(r)) return;
    const noteFilled = !!(r.note && String(r.note).trim());
    if(noteFilled) return;
    const rn = layout.dataStartRow + i;
    shapes.push(diagLineXml(shapeId++, `NoteDiagonal${i}`, 7, rn - 1, 13, rn));
  });

  return shapes;
}

async function buildWorkbookBlob(sheet){
  const zip = await JSZip.loadAsync(base64ToUint8Array(TEMPLATE_XLSX_BASE64));
  // 제조번호처럼 칸보다 글자가 길어질 수 있는 셀은 칸을 벗어나지 않도록
  // "셀에 맞게 줄임(shrinkToFit)" 스타일을 하나 추가한다 (styles.xml에 14번째 서식으로 삽입)
  let stylesXml = await zip.file('xl/styles.xml').async('string');
  stylesXml = stylesXml
    .replace('<cellXfs count="13">', '<cellXfs count="19">')
    .replace('</cellXfs>', '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" shrinkToFit="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="2" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="4" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="3" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf></cellXfs>');
  zip.file('xl/styles.xml', stylesXml);

  let sheetXml = buildSheetXml(sheet);

  // 빈 칸 사선(빗금) 도형이 필요하면 drawing 파트를 추가하고 시트에 연결한다
  const diagShapes = buildDiagonalShapes(sheet);
  if(diagShapes.length){
    zip.file('xl/drawings/drawing1.xml', buildDrawingXml(diagShapes));

    let contentTypesXml = await zip.file('[Content_Types].xml').async('string');
    contentTypesXml = contentTypesXml.replace('</Types>',
      '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>');
    zip.file('[Content_Types].xml', contentTypesXml);

    zip.file('xl/worksheets/_rels/sheet1.xml.rels',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>');

    sheetXml = sheetXml.replace('</worksheet>', '<drawing r:id="rId1"/></worksheet>');
  } else {
    zip.file('xl/worksheets/_rels/sheet1.xml.rels',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>');
  }

  zip.file('xl/worksheets/sheet1.xml', sheetXml);
  // 특정 프린터에 저장된 인쇄 설정(printerSettings1.bin)을 더 이상 참조하지 않으므로
  // 함께 제거 - 그래야 어느 PC/프린터에서 열어도 위 pageSetup(A4, 폭 맞춤)이 그대로 적용됨
  zip.remove('xl/printerSettings/printerSettings1.bin');
  // 문서 속성(작성자/마지막으로 수정한 사람)에 로그인 아이디(예: ajtwh7481)가 그대로
  // 남지 않도록, 이름으로 변환해서 기록 (없으면 일반 이름으로 대체)
  const authorName = (currentUser && displayName(currentUser)) || '기기가동기록서';
  const nowIso = new Date().toISOString().replace(/\.\d+Z$/,'Z');
  zip.file('docProps/core.xml',
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:creator>${xmlEscape(authorName)}</dc:creator><cp:lastModifiedBy>${xmlEscape(authorName)}</cp:lastModifiedBy><dcterms:created xsi:type="dcterms:W3CDTF">${nowIso}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${nowIso}</dcterms:modified></cp:coreProperties>`);
  return zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });
}

// 엑셀 시트 탭 이름으로 쓸 수 없는 문자 제거 + 31자 길이 제한
// (엑셀 시트명 금지문자: \ / ? * [ ] : , 앞뒤 공백/작은따옴표도 피함)
function sanitizeSheetName(name){
  let n = String(name || '시트').replace(/[\\/?*\[\]:]/g, '').trim();
  if(!n) n = '시트';
  return n.slice(0, 31);
}

/* ============================================================
   여러 기기를 "시트(탭)"로 묶은 엑셀 워크북 생성
   - sheetList: [{ device, sheet }, ...] 형태의 배열. 배열에 담긴
     순서가 그대로 엑셀 하단 탭 순서가 된다.
     (예: [RS-302, RG-203, NF-104(여과기), VD-102(건조기)])
   - 하나의 xlsx 파일 안에 기기별 시트를 만들고, 각 시트 서식/내용은
     buildSheetXml/buildDiagonalShapes(단일 시트용 로직)을 그대로 재사용한다.
============================================================ */
async function buildMultiSheetWorkbookBlob(sheetList){
  const zip = await JSZip.loadAsync(base64ToUint8Array(TEMPLATE_XLSX_BASE64));

  // 제조번호처럼 칸보다 글자가 길어질 수 있는 셀은 칸을 벗어나지 않도록
  // "셀에 맞게 줄임(shrinkToFit)" 스타일을 하나 추가 (워크북 전체에서 공유되는 서식이라 한 번만 추가)
  let stylesXml = await zip.file('xl/styles.xml').async('string');
  stylesXml = stylesXml
    .replace('<cellXfs count="13">', '<cellXfs count="19">')
    .replace('</cellXfs>', '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" shrinkToFit="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="2" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="4" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="3" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf></cellXfs>');
  zip.file('xl/styles.xml', stylesXml);

  // 원본 템플릿에 있던 단일 시트 관련 파츠는 여기서 새로 만들 것이므로 정리
  zip.remove('xl/printerSettings/printerSettings1.bin');
  zip.remove('xl/worksheets/sheet1.xml');
  zip.remove('xl/worksheets/_rels/sheet1.xml.rels');

  const sheetTagsXml = [];
  const relsTagsXml = [];
  const contentTypeOverrides = [];
  let nextRid = 10; // 기존 workbook.xml.rels의 rId1~4(시트/테마/스타일/공유문자열)과 겹치지 않게

  sheetList.forEach((entry, i)=>{
    const idx = i + 1;
    let sheetXml = buildSheetXml(entry.sheet);
    // 같은 워크북 안에서 탭이 여러 개 동시에 "선택됨" 상태가 되지 않도록,
    // 첫 번째 시트만 tabSelected="1"을 유지하고 나머지는 지운다.
    if(i > 0) sheetXml = sheetXml.replace('tabSelected="1" ', '');

    const diagShapes = buildDiagonalShapes(entry.sheet);
    if(diagShapes.length){
      zip.file(`xl/drawings/drawing${idx}.xml`, buildDrawingXml(diagShapes));
      contentTypeOverrides.push(`<Override PartName="/xl/drawings/drawing${idx}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
      zip.file(`xl/worksheets/_rels/sheet${idx}.xml.rels`,
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${idx}.xml"/></Relationships>`);
      sheetXml = sheetXml.replace('</worksheet>', '<drawing r:id="rId1"/></worksheet>');
    }
    zip.file(`xl/worksheets/sheet${idx}.xml`, sheetXml);
    contentTypeOverrides.push(`<Override PartName="/xl/worksheets/sheet${idx}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);

    const rid = `rId${nextRid++}`;
    const tabName = xmlEscape(sanitizeSheetName(entry.device));
    sheetTagsXml.push(`<sheet name="${tabName}" sheetId="${idx}" r:id="${rid}"/>`);
    relsTagsXml.push(`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${idx}.xml"/>`);
  });

  // xl/workbook.xml: <sheets>...</sheets>를 우리가 만든 시트 목록으로 교체 (순서 = 탭 순서)
  let workbookXml = await zip.file('xl/workbook.xml').async('string');
  workbookXml = workbookXml.replace(/<sheets>[\s\S]*?<\/sheets>/, `<sheets>${sheetTagsXml.join('')}</sheets>`);
  zip.file('xl/workbook.xml', workbookXml);

  // xl/_rels/workbook.xml.rels: 기존 시트(rId1) 관계만 제거하고, 테마/스타일/공유문자열 관계는 그대로 유지
  let relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  relsXml = relsXml.replace(/<Relationship Id="rId1"[^>]*\/>/, '');
  relsXml = relsXml.replace('</Relationships>', relsTagsXml.join('') + '</Relationships>');
  zip.file('xl/_rels/workbook.xml.rels', relsXml);

  // [Content_Types].xml: 기존 sheet1.xml 항목 제거 후 새 시트/도형 항목 추가
  let contentTypesXml = await zip.file('[Content_Types].xml').async('string');
  contentTypesXml = contentTypesXml.replace(
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>', '');
  contentTypesXml = contentTypesXml.replace('</Types>', contentTypeOverrides.join('') + '</Types>');
  zip.file('[Content_Types].xml', contentTypesXml);

  // docProps: 문서 속성(작성자 등) + 시트 이름 목록 갱신
  const authorName = (currentUser && displayName(currentUser)) || '기기가동기록서';
  const nowIso = new Date().toISOString().replace(/\.\d+Z$/,'Z');
  zip.file('docProps/core.xml',
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:creator>${xmlEscape(authorName)}</dc:creator><cp:lastModifiedBy>${xmlEscape(authorName)}</cp:lastModifiedBy><dcterms:created xsi:type="dcterms:W3CDTF">${nowIso}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${nowIso}</dcterms:modified></cp:coreProperties>`);
  const titleEntries = sheetList.map(e=>`<vt:lpstr>${xmlEscape(sanitizeSheetName(e.device))}</vt:lpstr>`).join('');
  zip.file('docProps/app.xml',
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Microsoft Excel</Application><DocSecurity>0</DocSecurity><ScaleCrop>false</ScaleCrop><HeadingPairs><vt:vector size="2" baseType="variant"><vt:variant><vt:lpstr>워크시트</vt:lpstr></vt:variant><vt:variant><vt:i4>${sheetList.length}</vt:i4></vt:variant></vt:vector></HeadingPairs><TitlesOfParts><vt:vector size="${sheetList.length}" baseType="lpstr">${titleEntries}</vt:vector></TitlesOfParts><LinksUpToDate>false</LinksUpToDate><SharedDoc>false</SharedDoc><HyperlinksChanged>false</HyperlinksChanged><AppVersion>16.0300</AppVersion></Properties>`);

  return zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ============================================================
   GOOGLE DRIVE 저장
   - 엑셀(.xlsx) 다운로드 파일을 구글드라이브의 "기기가동기록서"
     폴더에 자동 업로드합니다.
   - 사용 전 준비물: Google Cloud Console에서 OAuth 클라이언트 ID(웹
     애플리케이션)를 발급받아 아래 GOOGLE_CLIENT_ID 값에 넣어주세요.
     "승인된 자바스크립트 원본(Authorized JavaScript origins)"에는
     이 페이지를 여는 실제 주소(예: https://your-domain.com 또는
     http://localhost:포트번호)를 등록해야 합니다.
     ※ 파일을 그냥 더블클릭해서 여는 file:// 방식에서는 구글 로그인이
        동작하지 않습니다. 반드시 http(s) 서버로 열어야 합니다.
============================================================ */
const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GDRIVE_FOLDER_NAME = '기기가동기록서';

let gdriveTokenClientObj = null;
let gdriveAccessToken = null;
let gdriveFolderId = null;

function isGDriveConfigured(){
  return !!GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('YOUR_GOOGLE_CLIENT_ID') !== 0;
}

function getGDriveClient(){
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return null;
  if(!isGDriveConfigured()) return null;
  if(!gdriveTokenClientObj){
    gdriveTokenClientObj = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GDRIVE_SCOPE,
      callback: ()=>{}, // 매 호출마다 아래에서 덮어씀
    });
  }
  return gdriveTokenClientObj;
}

function requestGDriveToken(){
  return new Promise((resolve, reject)=>{
    const client = getGDriveClient();
    if(!client){ reject(new Error('NOT_CONFIGURED')); return; }
    client.callback = (resp)=>{
      if(!resp || resp.error){ reject(new Error((resp && resp.error) || 'AUTH_FAILED')); return; }
      gdriveAccessToken = resp.access_token;
      resolve(gdriveAccessToken);
    };
    client.error_callback = (err)=>{ reject(err || new Error('AUTH_FAILED')); };
    client.requestAccessToken({ prompt: '' });
  });
}

async function ensureGDriveToken(){
  if(gdriveAccessToken) return gdriveAccessToken;
  return requestGDriveToken();
}

async function getGDriveFolderId(token){
  if(gdriveFolderId) return gdriveFolderId;
  const q = encodeURIComponent(`name='${GDRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if(!res.ok) throw new Error('DRIVE_API_ERROR');
  const data = await res.json();
  if(data.files && data.files.length > 0){
    gdriveFolderId = data.files[0].id;
    return gdriveFolderId;
  }
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: GDRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  if(!createRes.ok) throw new Error('DRIVE_API_ERROR');
  const created = await createRes.json();
  gdriveFolderId = created.id;
  return gdriveFolderId;
}

async function uploadXlsxToDrive(blob, filename, isRetry){
  const token = await ensureGDriveToken();
  try{
    const folderId = await getGDriveFolderId(token);
    const metadata = { name: filename, parents: [folderId] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', blob);
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token },
      body: form
    });
    if(res.status === 401 && !isRetry){
      gdriveAccessToken = null;
      gdriveFolderId = null;
      return uploadXlsxToDrive(blob, filename, true);
    }
    if(!res.ok) throw new Error('DRIVE_UPLOAD_ERROR');
    return await res.json();
  }catch(e){
    if(!isRetry && e.message === 'DRIVE_API_ERROR'){
      gdriveAccessToken = null;
      gdriveFolderId = null;
      return uploadXlsxToDrive(blob, filename, true);
    }
    throw e;
  }
}

/* ============================================================
   다음달 기기가동 생성
   - 정식 7가지 품목(BASE_PRODUCTS)에 속한 모든 기기에 대해,
     "다음달"(오늘 날짜 기준) 빈 기록을 한 번에 만들어준다.
   - 이미 같은 연/월/기기 조합의 기록이 있으면 건너뛴다(중복 생성 방지).
============================================================ */
async function generateNextMonthSheets(){
  const now = new Date();
  let nextMonth = now.getMonth() + 2; // getMonth()는 0부터 시작하므로 +1(다음달) +1(0→1월 보정)
  let nextYear = now.getFullYear();
  if(nextMonth > 12){ nextMonth -= 12; nextYear += 1; }

  const targets = [];
  BASE_PRODUCTS.forEach(product=>{
    (BASE_TO_DEVICES[product] || []).forEach(device=>{
      targets.push({ product, device });
    });
  });

  let created = 0, skipped = 0;
  for(const t of targets){
    const location = locationForDevice(t.device) || '';
    const id = makeSheetId(nextYear, nextMonth, t.device, location);
    if(sheetIndex.some(s=>s.id===id)){ skipped++; continue; }
    const nowIso = new Date().toISOString();
    const data = {
      year: nextYear, month: nextMonth,
      product: t.product, device: t.device, location: location,
      rows: Array.from({length: DAYS_MIN_ROWS}, blankRow),
      footerNote:'', manager:'', approver:'',
      updatedAt: nowIso
    };
    await saveSheetById(id, data);
    sheetIndex.push({
      id, year: nextYear, month: nextMonth,
      product: t.product, device: t.device, location: location,
      updatedAt: nowIso,
      hasData: false
    });
    created++;
  }
  if(created > 0) await saveSheetIndex();
  renderRecordList(document.getElementById('record-search-input').value);
  toast(`${nextYear}년 ${nextMonth}월 기록 ${created}건 생성됨` + (skipped ? ` (이미 있던 ${skipped}건은 건너뜀)` : ''));
}

  btn.disabled = true;

/* ============================================================
   선택한 월 기록 일괄 저장(내보내기)
   - 상단 툴바에서 사용자가 고른 "년도/월"에 대해, 정식 7가지 품목의
     모든 기기를 대상으로 각각 엑셀(.xlsx)로 만들어 사용자가 직접 고른
     폴더(예: 바탕화면)에 저장한다.
   - 그 달에 실제로 작성된 기록이 있으면 그 내용 그대로, 아예 기록을
     작성하지 않은 기기가 있으면(=기기가동 기록 자체를 안 한 경우) 빈
     양식으로 만들어서 함께 저장한다. → 기록을 안 했다는 이유로 저장이
     안 되던 문제를 해결.
   - 저장만 하고, 이 앱의 저장소(불러오기 목록)에 있는 기록은 그대로
     유지한다(삭제하지 않음).
   - 저장할 때 품목코드(G0720, O0830 등)별로 하위 폴더를 만들어 그 안에
     같은 품목 파일들을 모아서 저장한다. (폴더 선택을 지원하지 않는
     브라우저는 폴더 생성이 안 되므로 다운로드 폴더에 그대로 받는다.)
     파일명은 "기기가동기록서_기기번호_연월"(예: 기기가동기록서_VD-101_202607.xlsx) 형식.
   - 폴더 선택 창은 File System Access API(showDirectoryPicker)를 지원하는
     브라우저(Chrome/Edge, https 또는 localhost)에서만 뜬다. 지원하지 않으면
     각 파일을 브라우저 기본 다운로드 폴더로 순차 다운로드하는 방식으로 대체한다.
============================================================ */
async function saveAndArchiveSheetsForMonth(targetYear, targetMonth){
  // 정식 7가지 품목(BASE_PRODUCTS) 중, 기기가 실제로 매핑되어 있는 품목만 대상으로 함
  // 품목 하나당 파일 1개를 만들고, 그 안에 기기별로 시트(탭)를 나눈다.
  // 탭 순서는 BASE_TO_DEVICES[product]에 정의된 순서를 그대로 따른다.
  // (예: O0330 → RS-302, RG-203, NF-104(여과기), VD-102(건조기) 순)
  const productList = BASE_PRODUCTS.filter(p => (BASE_TO_DEVICES[p] || []).length > 0);

  if(productList.length === 0){
    toast('저장할 품목 목록이 없습니다.', true);
    return;
  }

  const existingByDevice = new Map();
  sheetIndex
    .filter(s => s.year === targetYear && s.month === targetMonth)
    .forEach(s => existingByDevice.set(s.device, s));

  const totalDeviceCount = productList.reduce((sum, p)=> sum + BASE_TO_DEVICES[p].length, 0);
  const writtenCount = productList.reduce((sum, p)=>
    sum + BASE_TO_DEVICES[p].filter(d => existingByDevice.has(d)).length, 0);
  const blankCount = totalDeviceCount - writtenCount;

  let confirmMsg = `${targetYear}년 ${targetMonth}월 기록을 품목별 엑셀 파일(품목 1개당 파일 1개, 기기별로 시트를 나눠서 저장)로 저장합니다. `
    + `(품목 ${productList.length}건 / 기기 ${totalDeviceCount}건, 작성된 기록 ${writtenCount}건`;
  confirmMsg += blankCount > 0 ? `, 기록을 작성하지 않은 기기 ${blankCount}건은 빈 시트로 저장) ` : `) `;
  confirmMsg += '계속할까요?';
  if(!confirm(confirmMsg)) return;

  const supportsDirPicker = typeof window.showDirectoryPicker === 'function';
  let dirHandle = null;
  if(supportsDirPicker){
    try{
      dirHandle = await window.showDirectoryPicker();
    }catch(e){
      if(e && e.name === 'AbortError') return; // 사용자가 폴더 선택을 취소함
      console.error(e);
      toast('저장 폴더를 여는 중 오류가 발생했습니다.', true);
      return;
    }
  }

  let savedDeviceCount = 0;
  let savedFileCount = 0;
  const failedProducts = [];

  for(const product of productList){
    const devices = BASE_TO_DEVICES[product];
    try{
      const sheetList = [];
      for(const device of devices){
        const location = locationForDevice(device) || '';
        const existing = existingByDevice.get(device);
        let data = existing ? await loadSheetById(existing.id) : null;
        if(!data){
          data = {
            year: targetYear, month: targetMonth,
            product, device, location,
            rows: Array.from({length: DAYS_MIN_ROWS}, blankRow),
            footerNote:'', manager:'', approver:'',
            updatedAt: new Date().toISOString()
          };
        } else {
          savedDeviceCount++;
        }
        sheetList.push({ device, sheet: data });
      }

      const blob = await buildMultiSheetWorkbookBlob(sheetList);
      const fname = `기기가동기록서_${sanitize(product)||'품목'}_${targetYear}${String(targetMonth).padStart(2,'0')}.xlsx`;
      if(dirHandle){
        const fileHandle = await dirHandle.getFileHandle(fname, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
      } else {
        // 폴더 선택을 지원하지 않는 브라우저는 다운로드 폴더에 그대로 받는다
        downloadBlob(blob, fname);
      }
      savedFileCount++;
    }catch(e){
      console.error(e);
      failedProducts.push(product);
    }
  }

  const locNote = dirHandle ? '선택한 폴더에' : '브라우저 기본 다운로드 폴더에';
  let msg = `${targetYear}년 ${targetMonth}월 기록을 품목별 파일 ${savedFileCount}건(기기 총 ${totalDeviceCount}건 · 시트로 구성, 작성된 기록 ${savedDeviceCount}건 + 빈 시트 ${totalDeviceCount - savedDeviceCount}건)으로 ${locNote} 저장했습니다.`;
  if(failedProducts.length) msg += ` (실패한 품목: ${failedProducts.join(', ')})`;
  toast(msg, failedProducts.length > 0);
}

  const targetYear = parseInt(document.getElementById('sel-year').value, 10);
  const targetMonth = parseInt(document.getElementById('sel-month').value, 10);
