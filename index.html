<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기기가동 기록서</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --steel-1:#1b1f23;
    --steel-2:#262b30;
    --steel-3:#33393f;
    --steel-line:#3d444b;
    --paper:#f6f1e4;
    --paper-2:#efe8d6;
    --paper-line:#cdbf9c;
    --ink:#242019;
    --ink-soft:#5b5346;
    --amber:#e2a13a;
    --amber-dark:#b97e22;
    --teal:#33645f;
    --teal-dark:#234642;
    --stamp:#a8332a;
    --danger:#a8332a;
    --off-white:#f2ede2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--steel-1);
    font-family:'Noto Sans KR',sans-serif;
    color:var(--off-white);
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:var(--ink);}
  input,select,textarea,button{font-family:inherit;}

  /* ---------- utility bar textures ---------- */
  .hazard-strip{
    height:6px;
    background:repeating-linear-gradient(135deg, var(--amber) 0 14px, var(--steel-1) 14px 28px);
    opacity:.9;
  }

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--steel-2);
    border:1px solid var(--steel-line);
    border-radius:4px;
    padding:0 0 28px 0;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .login-head{
    padding:28px 28px 18px 28px;
    border-bottom:1px solid var(--steel-line);
  }
  .plate-label{
    font-family:'Oswald',sans-serif;
    letter-spacing:.18em;
    font-size:11px;
    color:var(--amber);
    font-weight:600;
    text-transform:uppercase;
  }
  .login-head h1{
    font-family:'Oswald',sans-serif;
    font-size:26px;
    font-weight:600;
    margin:6px 0 0 0;
    letter-spacing:.01em;
  }
  .login-sub{
    color:#9aa1a6;
    font-size:13px;
    margin-top:6px;
  }
  .login-body{padding:22px 28px 0 28px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:#a7adb2;
    margin-bottom:6px;
    font-weight:500;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    font-size:14px;
    outline:none;
  }
  .field input:focus{border-color:var(--amber);}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:3px;
    padding:11px 18px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:filter .15s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--amber);color:#241a08;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:#c7ccd0;border:1px solid var(--steel-line);}
  .btn-ghost:hover{border-color:#7d858c;}
  .btn-teal{background:var(--teal);color:#eef6f4;}
  .btn-teal:hover{filter:brightness(1.12);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .login-error{
    background:rgba(168,51,42,.15);
    border:1px solid rgba(168,51,42,.5);
    color:#ff9a8f;
    font-size:12.5px;
    padding:9px 11px;
    border-radius:3px;
    margin-bottom:14px;
  }
  .login-note{
    font-size:11.5px;
    color:#7d858c;
    padding:16px 28px 0 28px;
    line-height:1.6;
  }
  .login-toggle{
    text-align:center;
    margin-top:16px;
    font-size:12.5px;
    color:#9aa1a6;
  }
  .login-toggle a{color:var(--amber);cursor:pointer;text-decoration:underline;}

  /* ---------- APP SHELL ---------- */
  #app-screen{display:none;min-height:100vh;grid-template-columns:280px 1fr;}
  #app-screen.active{display:grid;}
  .sidebar{
    background:var(--steel-2);
    border-right:1px solid var(--steel-line);
    padding:20px 16px 20px 16px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:14px;
    border-bottom:1px solid var(--steel-line);
  }
  .brand-mark{
    width:34px;height:34px;border-radius:3px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;color:#241a08;font-size:15px;
  }
  .brand-text .t1{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:.03em;}
  .brand-text .t2{font-size:11px;color:#9aa1a6;}
  .side-section-label{
    font-size:11px;
    letter-spacing:.12em;
    color:var(--amber);
    font-weight:600;
    text-transform:uppercase;
  }
  .user-pill{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    padding:9px 11px;
    font-size:12.5px;
  }
  .user-pill span{color:#c7ccd0;}
  .user-pill a{color:#9aa1a6;font-size:12px;cursor:pointer;}
  .user-pill a:hover{color:var(--amber);}
  .readonly-banner{
    background:rgba(226,161,58,.14);
    border:1px solid var(--amber);
    color:var(--amber);
    font-size:11.5px;
    line-height:1.6;
    padding:9px 10px;
    border-radius:3px;
  }
  .status-chip.readonly{border-color:var(--amber);color:var(--amber);}
  .mode-badge{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--steel-line);color:#9aa1a6;}
  .mode-badge.server{border-color:var(--teal);color:#7fd8c9;}
  .mode-badge.local{border-color:var(--danger);color:#ff9a8f;}
  .file-warning{background:rgba(168,51,42,.2);border:1px solid var(--danger);color:#ff9a8f;font-size:12.5px;padding:10px 12px;border-radius:3px;margin-bottom:14px;line-height:1.6;}

  .record-search input{
    width:100%;
    padding:8px 10px;
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    font-size:13px;
    margin-bottom:10px;
  }
  .record-list{
    display:flex;flex-direction:column;gap:6px;
    overflow-y:auto;
    max-height:calc(100vh - 420px);
    min-height:120px;
    padding-right:2px;
  }
  .record-item{
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    padding:9px 10px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .record-item:hover{border-color:var(--amber);}
  .record-item.active{border-color:var(--amber);background:rgba(226,161,58,.09);}
  .record-item .ri-main{font-size:12.5px;line-height:1.5;}
  .record-item .ri-main b{color:var(--off-white);display:block;font-size:13px;}
  .record-item .ri-main span{color:#8f9599;}
  .record-item .ri-del{
    background:none;border:none;color:#6d747a;cursor:pointer;font-size:15px;line-height:1;padding:2px;
  }
  .record-item .ri-del:hover{color:var(--danger);}
  .empty-note{font-size:12px;color:#6d747a;padding:10px 2px;line-height:1.6;}

  .sidebar-foot{margin-top:auto;font-size:11px;color:#6d747a;line-height:1.6;border-top:1px solid var(--steel-line);padding-top:12px;}

  /* ---------- MAIN ---------- */
  .main{padding:26px 34px 60px 34px;overflow-x:auto;}
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:flex-end;
    background:var(--steel-2);
    border:1px solid var(--steel-line);
    border-radius:4px;
    padding:18px 20px;
    margin-bottom:22px;
  }
  .tb-field{display:flex;flex-direction:column;gap:5px;}
  .tb-field label{font-size:11px;color:#9aa1a6;font-weight:500;letter-spacing:.02em;}
  .tb-field select, .tb-field input{
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    padding:9px 10px;
    font-size:13.5px;
    min-width:110px;
  }
  .tb-field input.wide{min-width:170px;}
  .tb-spacer{flex:1;}
  .status-chip{
    font-size:11.5px;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--steel-line);
    color:#9aa1a6;
  }
  .status-chip.dirty{border-color:var(--amber);color:var(--amber);}
  .status-chip.saved{border-color:var(--teal);color:#7fd8c9;}

  /* paper ledger */
  .ledger-wrap{
    background:var(--paper);
    border-radius:4px;
    border:1px solid var(--paper-line);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    color:var(--ink);
    overflow:hidden;
  }
  .ledger-title-bar{
    background:var(--paper-2);
    border-bottom:2px solid var(--ink);
    padding:18px 22px 14px 22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:10px;
  }
  .ledger-title-bar h2{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    margin:0;
    letter-spacing:.02em;
  }
  .ledger-meta{
    font-family:'Roboto Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .ledger-info-row{
    display:flex;
    border-bottom:1px solid var(--paper-line);
    font-size:13px;
  }
  .info-cell{
    padding:9px 14px;
    border-right:1px solid var(--paper-line);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .info-cell:last-child{border-right:none;flex:1;}
  .info-cell .lbl{font-weight:700;color:var(--ink-soft);white-space:nowrap;font-size:12px;}
  .info-cell .val{font-weight:500;}
  .info-cell .loc-input{
    flex:1;
    min-width:0;
    border:1px solid var(--paper-line);
    background:#fff59d;
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    padding:6px 8px;
    border-radius:2px;
    outline:none;
    font-family:'Noto Sans KR',sans-serif;
  }
  .info-cell .loc-input:focus{
    border-color:var(--amber-dark);
    background:#ffef6b;
  }

  table.grid{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.grid thead th{
    background:var(--ink);
    color:var(--off-white);
    font-family:'Oswald',sans-serif;
    font-weight:500;
    letter-spacing:.02em;
    padding:9px 6px;
    border-right:1px solid #3a342a;
    font-size:12.5px;
    position:sticky;top:0;
  }
  table.grid tbody td{
    border-bottom:1px solid var(--paper-line);
    border-right:1px solid var(--paper-line);
    padding:0;
  }
  table.grid tbody tr:nth-child(even){background:rgba(0,0,0,.02);}
  table.grid td input{
    width:100%;
    border:none;
    background:transparent;
    padding:8px 8px;
    font-size:13px;
    color:var(--ink);
    outline:none;
    font-family:'Noto Sans KR',sans-serif;
  }
  table.grid td input:focus{background:rgba(226,161,58,.16);}
  table.grid td select.cell-select{
    width:100%;
    border:none;
    background:transparent;
    padding:8px 6px;
    font-size:13px;
    color:var(--ink);
    outline:none;
    font-family:'Noto Sans KR',sans-serif;
  }
  table.grid td select.cell-select:focus{background:rgba(226,161,58,.16);}
  td.sign-cell{padding:4px 6px;text-align:center;}
  .sign-btn{
    border:1px solid var(--teal-dark);
    background:#eef6f4;
    color:var(--teal-dark);
    font-size:12px;
    font-weight:600;
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .sign-btn:hover{background:var(--teal);color:#fff;}
  .sign-filled{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    color:var(--ink);
  }
  .sign-filled .sign-name{
    font-family:'Oswald',sans-serif;
    letter-spacing:.01em;
  }
  .sign-filled .sign-cancel{
    border:none;background:none;color:#a68f6a;cursor:pointer;font-size:12px;padding:0 2px;
  }
  .sign-filled .sign-cancel:hover{color:var(--danger);}
  .sign-note{
    font-size:11px;
    color:var(--ink-soft);
    font-style:italic;
  }
  table.grid td.col-date input, table.grid td.col-time input{font-family:'Roboto Mono',monospace;}
  td.col-del{text-align:center;width:34px;}
  td.col-del button{
    border:none;background:none;color:#a68f6a;cursor:pointer;font-size:16px;
  }
  td.col-del button:hover{color:var(--danger);}

  .grid-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    background:var(--paper-2);
    border-top:1px solid var(--paper-line);
    flex-wrap:wrap;
    gap:10px;
  }
  .grid-actions .left-actions{display:flex;gap:8px;}
  .link-btn{
    background:none;border:none;color:var(--teal-dark);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;
  }

  .footer-block{
    display:grid;
    grid-template-columns:1.4fr .8fr .8fr;
    border-top:2px solid var(--ink);
  }
  .footer-cell{
    border-right:1px solid var(--paper-line);
    padding:10px 14px 14px 14px;
  }
  .footer-cell:last-child{border-right:none;}
  .footer-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.05em;
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .footer-cell textarea{
    width:100%;
    min-height:64px;
    border:1px solid var(--paper-line);
    background:#fffdf7;
    border-radius:3px;
    padding:8px;
    font-size:13px;
    resize:vertical;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--ink);
  }
  .sign-box{
    position:relative;
    min-height:64px;
    border:1px solid var(--paper-line);
    background:#fffdf7;
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
  }
  .sign-box input, .sign-box select.sign-select{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-size:15px;
    outline:none;
    color:var(--ink);
  }
  .stamp{
    position:absolute;
    right:8px;
    bottom:6px;
    width:40px;height:40px;
    border:2.5px solid var(--stamp);
    border-radius:50%;
    color:var(--stamp);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:700;
    transform:rotate(-14deg);
    opacity:.85;
    letter-spacing:.02em;
    pointer-events:none;
  }

  .bottom-bar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
  }

  .storage-note{
    font-size:11.5px;
    color:#6d747a;
    margin-top:10px;
    line-height:1.6;
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--teal);
    color:#eef6f4;
    padding:11px 20px;
    border-radius:4px;
    font-size:13.5px;
    font-weight:600;
    box-shadow:0 10px 26px rgba(0,0,0,.35);
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--danger);}

  @media (max-width:880px){
    #app-screen.active{grid-template-columns:1fr;}
    .sidebar{border-right:none;border-bottom:1px solid var(--steel-line);}
    .main{padding:20px 16px 60px 16px;}
    .footer-block{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="hazard-strip"></div>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-head">
      <div class="plate-label">현장 설비 관리</div>
      <h1>기기가동 기록서</h1>
      <div class="login-sub">아이디와 비밀번호로 로그인하세요</div>
    </div>
    <div class="login-body">
      <div id="login-error-slot"></div>
      <form id="login-form">
        <div class="field">
          <label>아이디</label>
          <input type="text" id="login-username" autocomplete="username" required>
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>
      <div class="login-toggle" id="login-toggle-slot"></div>
    </div>
    <div class="login-note" id="login-note-slot"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-screen">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">기</div>
      <div class="brand-text">
        <div class="t1">기기가동 기록서</div>
        <div class="t2">현장 데이터 관리</div>
      </div>
    </div>

    <div class="user-pill">
      <span>👤 <b id="current-user-label"></b></span>
      <a id="logout-btn">로그아웃</a>
    </div>
    <div class="readonly-banner" id="readonly-banner" style="display:none;"></div>

    <div>
      <div class="side-section-label" style="margin-bottom:8px;">저장된 기록</div>
      <div class="record-search">
        <input type="text" id="record-search-input" placeholder="기기명, 설치장소 검색">
      </div>
      <div class="record-list" id="record-list"></div>
    </div>

    <div class="sidebar-foot" id="sidebar-foot-note">
      데이터는 이 앱을 사용하는 모든 사용자에게 공유됩니다. 같은 현장/팀에서 함께 사용하는 공용 저장소입니다.
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="tb-field">
        <label>년도</label>
        <select id="sel-year"></select>
      </div>
      <div class="tb-field">
        <label>월</label>
        <select id="sel-month"></select>
      </div>
      <div class="tb-field">
        <label>품목명</label>
        <select id="sel-product" class="wide"></select>
      </div>
      <div class="tb-field">
        <label>기기명</label>
        <select id="sel-device" class="wide"></select>
      </div>
      <!-- 설치장소 입력 필드 추가 -->
      <div class="tb-field">
        <label>설치장소</label>
        <input type="text" id="sel-location" class="wide" placeholder="설치장소 입력">
      </div>
      <button class="btn btn-teal" id="load-btn">불러오기 / 새 기록</button>
      <div class="tb-spacer"></div>
      <span class="status-chip" id="status-chip">기록을 불러오세요</span>
      <span class="mode-badge" id="mode-badge"></span>
    </div>

    <div class="readonly-banner" id="sheet-lock-banner" style="display:none;"></div>

    <div id="ledger-area"></div>

    <div class="bottom-bar" id="bottom-actions" style="display:none;">
      <button class="btn btn-ghost" id="download-btn">📥 엑셀(.xlsx) 다운로드</button>

/* ============================================================

============================================================ */
const LS_PREFIX = 'eqlog__';
let storageModeNotified = false;
let useServerApi = false;
let serverShareUrls = [];

function hasArtifactStorage(){
  return typeof window.storage !== 'undefined'
      && window.storage
      && typeof window.storage.get === 'function';
}

function storageModeLabel(){
  if(useServerApi) return 'server';
  if(hasArtifactStorage()) return 'artifact';
  return 'local';
}

async function initStorageBackend(){
  if(location.protocol === 'file:'){
    useServerApi = false;
    serverShareUrls = [];
    return;
  }
  try{
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), 3000) : null;
    const r = await fetch('/api/health', ctrl ? { signal: ctrl.signal } : {});
    if(timer) clearTimeout(timer);
    useServerApi = r.ok;
    if(r.ok){
      const info = await r.json();
      serverShareUrls = info.shareUrls || [];
    }
  }catch(e){
    useServerApi = false;
    serverShareUrls = [];
  }
}

async function apiJson(path, opts={}){
  const r = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  if(!r.ok) throw new Error('API ' + r.status);
  return r.json();
}

function notifyStorageMode(){
  if(storageModeNotified) return;
  storageModeNotified = true;
  const mode = storageModeLabel();
}

function updateModeBadge(){
  const badge = document.getElementById('mode-badge');
  if(!badge) return;
  const mode = storageModeLabel();
  if(mode === 'server'){
    badge.textContent = '공유 서버 연결됨';
    badge.className = 'mode-badge server';
  } else if(mode === 'local'){
    badge.textContent = '단독 실행 (공유 안 됨)';
    badge.className = 'mode-badge local';
  } else {
    badge.textContent = '공유 저장소';
    badge.className = 'mode-badge';
  }
}

async function stGet(key, shared){
  notifyStorageMode();
  if(useServerApi){
    try{
      const data = await apiJson('/api/kv/' + encodeURIComponent(key));
      if(data.value === null || data.value === undefined) return null;
      return { key, value: data.value, shared: !!shared };
    }catch(e){ return null; }
  }
  if(hasArtifactStorage()){
    try{ return await window.storage.get(key, shared); }
    catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw===null ? null : {key, value:raw, shared:!!shared};
  }catch(e){ return null; }
}
async function stSet(key, value, shared){
  notifyStorageMode();
  if(useServerApi){
    try{
      await apiJson('/api/kv/' + encodeURIComponent(key), {
        method: 'PUT',
        body: JSON.stringify({ value }),
      });
      return { key, value, shared: !!shared };
    }catch(e){ return null; }
  }
  if(hasArtifactStorage()){
    try{ return await window.storage.set(key, value, shared); }
    catch(e){ return null; }
  }
  try{
    localStorage.setItem(LS_PREFIX+key, value);
    return {key, value, shared:!!shared};
  }catch(e){ return null; }
}
async function stDelete(key, shared){
  notifyStorageMode();
  if(useServerApi){
    try{
      await apiJson('/api/kv/' + encodeURIComponent(key), { method: 'DELETE' });
      return { key, deleted: true, shared: !!shared };
    }catch(e){ return null; }
  }
  if(hasArtifactStorage()){
    try{ return await window.storage.delete(key, shared); }
    catch(e){ return null; }
  }
  try{
    localStorage.removeItem(LS_PREFIX+key);
    return {key, deleted:true, shared:!!shared};
  }catch(e){ return null; }
}

function showLoginError(msg){

document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  showLoginError('');
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if(!username || !password){ showLoginError('아이디와 비밀번호를 입력하세요.'); return; }

  const submitBtn = document.querySelector('#login-form button[type="submit"]');
  const restoreLabel = submitBtn.textContent;
  function setLoggingIn(on){
    submitBtn.disabled = on;
    submitBtn.textContent = on ? '로그인 확인 중…' : restoreLabel;
  }

  const users = await loadUsers();

  if(signupMode){
    if(users.some(u=>u.username===username)){
      showLoginError('이미 존재하는 아이디입니다.');
      return;
    }
    users.push({ username, password });
    await saveUsers(users);
    currentUser = username;
    setLoggingIn(true);
    await establishSession();
    setLoggingIn(false);
    enterApp();
    return;
  }

  if(users.length===0){
    showLoginError('등록된 계정이 없습니다. 먼저 관리자 계정을 생성하세요.');
    signupMode = true;
    renderLoginExtras();
    return;
  }
  const found = users.find(u=>u.username===username && u.password===password);
  if(!found){
    showLoginError('아이디 또는 비밀번호가 올바르지 않습니다.');
    return;
  }
  currentUser = username;
  setLoggingIn(true);
  await establishSession();
  setLoggingIn(false);
  enterApp();
});

function populateDeviceLocation(){
  const pSel = document.getElementById('sel-product');
  const dSel = document.getElementById('sel-device');
  const lInput = document.getElementById('sel-location');

  pSel.innerHTML = '<option value="">품목명 선택 (전체)</option>' +
    PRODUCT_CODES.map(c=>`<option value="${c}">${c}</option>`).join('');

  fillDeviceOptions('');

  pSel.onchange = ()=>{
    fillDeviceOptions(pSel.value);
  };

  // 기기 선택 시 툴바의 설치장소 자동 변경
  dSel.onchange = ()=>{
    if(dSel.value){
      lInput.value = locationForDevice(dSel.value);
    } else {
      lInput.value = '';
    }
  };
}

function fillDeviceOptions(productCode){
  const dSel = document.getElementById('sel-device');
  const list = productCode && PRODUCT_DEVICE_MAP[productCode]
    ? PRODUCT_DEVICE_MAP[productCode]
    : DEVICE_CODES;
  const prevValue = dSel.value;
  dSel.innerHTML = '<option value="">기기명 선택</option>' +
    list.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(list.includes(prevValue)) dSel.value = prevValue;
}

function populateYearMonth(){
  const ySel = document.getElementById('sel-year');
  const mSel = document.getElementById('sel-month');
  const now = new Date();
  const thisYear = now.getFullYear();
  ySel.innerHTML='';
  for(let y=thisYear-2; y<=thisYear+1; y++){
    const opt = document.createElement('option');
    opt.value=y; opt.textContent=y+'년';
    if(y===thisYear) opt.selected=true;
    ySel.appendChild(opt);
  }
  mSel.innerHTML='';
  for(let m=1;m<=12;m++){
    const opt = document.createElement('option');
    opt.value=m; opt.textContent=m+'월';
    if(m===now.getMonth()+1) opt.selected=true;
    mSel.appendChild(opt);
  }
}

    list.innerHTML = `<div class="empty-note">저장된 기록이 없습니다. 상단에서 년/월과 기기 정보를 입력하고 "불러오기 / 새 기록"을 눌러 시작하세요.</div>`;
    return;

  list.innerHTML = items.map(s=>`
    <div class="record-item ${s.id===currentSheetId?'active':''}" data-id="${s.id}">
      <div class="ri-main">
        <b>${escapeHtml(s.device)||'(기기명 미입력)'}</b>
        <span>${s.year}년 ${s.month}월 · ${escapeHtml(s.product)? escapeHtml(s.product)+' · ':''}${escapeHtml(s.location)||'-'}</span>
      </div>
      <button class="ri-del" data-del="${s.id}" title="삭제">✕</button>
    </div>
  `).join('');

  list.querySelectorAll('.record-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.dataset.del) return;
      openSheet(el.dataset.id);
    });
  });
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(isReadOnly){ toast('보기 전용 모드에서는 삭제할 수 없습니다.', true); return; }
      const id = btn.dataset.del;
      const meta = sheetIndex.find(s=>s.id===id);
      if(!confirm(`"${meta.device} / ${meta.year}년 ${meta.month}월" 기록을 삭제하시겠습니까? 되돌릴 수 없습니다.`)) return;
      await deleteSheetById(id);
      sheetIndex = sheetIndex.filter(s=>s.id!==id);
      await saveSheetIndex();
      if(currentSheetId===id){
        currentSheet = null;
        currentSheetId = null;
        document.getElementById('ledger-area').innerHTML='';
        document.getElementById('bottom-actions').style.display='none';
        document.getElementById('sheet-lock-banner').style.display='none';
        document.getElementById('status-chip').textContent='기록을 불러오세요';
        document.getElementById('status-chip').className='status-chip';
      }
      renderRecordList(document.getElementById('record-search-input').value);
      toast('삭제되었습니다.');
    });
  });
}

document.getElementById('record-search-input').addEventListener('input', (e)=>{
  renderRecordList(e.target.value);
});

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

============================================================ */
document.getElementById('load-btn').addEventListener('click', async ()=>{
  const year = parseInt(document.getElementById('sel-year').value,10);
  const month = parseInt(document.getElementById('sel-month').value,10);
  const product = document.getElementById('sel-product').value.trim();
  const device = document.getElementById('sel-device').value.trim();
  const location = document.getElementById('sel-location').value.trim() || '미지정';

  if(!device){ toast('기기명을 선택하세요.', true); return; }
  if(isDirty && !confirm('저장하지 않은 변경사항이 있습니다. 계속하시겠습니까?')) return;

  const id = makeSheetId(year, month, device, location);
  await openSheet(id, {year, month, product, device, location});
});

async function openSheet(id, metaIfNew){
  let data = await loadSheetById(id);
  isEditingExisting = !!data;
  if(!data){
    if(!metaIfNew){
      const meta = sheetIndex.find(s=>s.id===id);
      metaIfNew = meta || {year:'', month:'', product:'', device:'', location:''};
    }
    data = {
      year: metaIfNew.year, month: metaIfNew.month,
      product: metaIfNew.product || '', device: metaIfNew.device, location: metaIfNew.location,
      rows: Array.from({length: DAYS_MIN_ROWS}, blankRow),
      footerNote:'', manager:'', approver:'',
      updatedAt: new Date().toISOString()
    };
  }
  currentSheet = data;
  currentSheetId = id;
  rowSnapshotMap = new Map();
  if(isEditingExisting){
    currentSheet.rows.forEach(r => rowSnapshotMap.set(r, JSON.stringify(r)));
  }

  document.getElementById('sel-year').value = data.year;
  document.getElementById('sel-month').value = data.month;
  document.getElementById('sel-product').value = data.product || '';
  fillDeviceOptions(data.product || '');
  document.getElementById('sel-device').value = data.device;
  document.getElementById('sel-location').value = data.location || '';

  renderLedger();
  document.getElementById('bottom-actions').style.display='flex';
  setDirty(false);
  renderRecordList(document.getElementById('record-search-input').value);
}

function refreshStamp(inputId, value){

  } else if(!value && stamp){
    stamp.remove();
  }
}

function renderWorkerCell(td, rowObj, checkerTd){

      cancelBtn.className = 'sign-cancel';

      });

      setDirty(true);
      renderWorkerCell(td, rowObj, checkerTd);
      renderCheckerCell(checkerTd, rowObj, td);
    });

  }
}

function createRowEl(rowObj){
  const tr = document.createElement('tr');
  const textFields = [
    ['date','col-date','날짜'],
    ['time','col-time','예: 09:00~18:00'],
    ['mfgNo','','제조번호']
  ];
  textFields.forEach(([key, cls, placeholder])=>{
    const td = document.createElement('td');
    if(cls) td.className = cls;
    const input = document.createElement('input');
    input.type='text';
    input.value = rowObj[key] || '';
    input.placeholder = placeholder;
    input.readOnly = isEditBlocked();
    input.addEventListener('input', ()=>{ rowObj[key] = input.value; setDirty(true); });
    td.appendChild(input);
    tr.appendChild(td);
  });

  {
    const td = document.createElement('td');
    const procs = processesForDevice(currentSheet && currentSheet.device);
    const sel = document.createElement('select');
    sel.className = 'cell-select';
    sel.disabled = isEditBlocked();
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = procs.length ? '공정 선택' : '작업공정';
    sel.appendChild(empty);
    procs.forEach(p=>{
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      sel.appendChild(opt);
    });
    if(rowObj.process && !procs.includes(rowObj.process)){
      const opt = document.createElement('option');
      opt.value = rowObj.process;
      opt.textContent = rowObj.process;
      sel.appendChild(opt);
    }
    sel.value = rowObj.process || '';
    sel.addEventListener('change', ()=>{
      rowObj.process = sel.value;
      setDirty(true);
    });
    td.appendChild(sel);
    tr.appendChild(td);
  }

  const workerTd = document.createElement('td');
  const checkerTd = document.createElement('td');
  renderWorkerCell(workerTd, rowObj, checkerTd);
  renderCheckerCell(checkerTd, rowObj, workerTd);
  tr.appendChild(workerTd);
  tr.appendChild(checkerTd);

  {
    const td = document.createElement('td');
    const input = document.createElement('input');
    input.type='text';
    input.value = rowObj[note] || '';
    input.placeholder = '비고';
    input.readOnly = isEditBlocked();
    input.addEventListener('input', ()=>{ rowObj.note = input.value; setDirty(true); });
    td.appendChild(input);
    tr.appendChild(td);
  }

  const delTd = document.createElement('td');
  delTd.className='col-del';
  const delBtn = document.createElement('button');
  delBtn.textContent='✕';
  delBtn.title='행 삭제';
  if(isEditBlocked()) delBtn.disabled = true;
  delBtn.addEventListener('click', ()=>{
    if(isEditBlocked()){ toast('보기 전용 모드에서는 삭제할 수 없습니다.', true); return; }
    if(!confirm('이 행을 삭제하시겠습니까?')) return;
    const idx = currentSheet.rows.indexOf(rowObj);
    if(idx>-1) currentSheet.rows.splice(idx,1);
    tr.remove();
    setDirty(true);
    document.querySelector('.grid-actions div[style]').textContent = `총 ${currentSheet.rows.length}행`;
  });
  delTd.appendChild(delBtn);
  tr.appendChild(delTd);
  return tr;
}

/* ============================================================
   SAVE
============================================================ */
document.getElementById('save-btn').addEventListener('click', async ()=>{
  if(!currentSheet){ toast('먼저 기록을 불러오세요.', true); return; }
  if(isEditBlocked()){ toast('보기 전용 모드에서는 저장할 수 없습니다.', true); return; }

  if(isEditingExisting){
    const changedRows = currentSheet.rows.filter(r =>
      rowSnapshotMap.has(r) && JSON.stringify(r) !== rowSnapshotMap.get(r)
    );
    if(changedRows.length > 0){
      const reason = prompt(`${changedRows.length}개 행이 수정되었습니다. 수정 사유를 입력해주세요. (해당 행의 비고란에 기록됩니다)`);
      if(!reason || !reason.trim()){
        toast('수정 사유를 입력해야 저장할 수 있습니다.', true);
        return;
      }
      const now = new Date();
      const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const who = currentUser ? ` / ${displayName(currentUser)}` : '';
      const entry = `[수정 ${stamp}${who}] ${reason.trim()}`;
      changedRows.forEach(r=>{
        r.note = r.note ? `${r.note} / ${entry}` : entry;
      });
      renderLedger();
    }
  }

  currentSheet.year = parseInt(document.getElementById('sel-year').value,10);
  currentSheet.month = parseInt(document.getElementById('sel-month').value,10);
  currentSheet.product = document.getElementById('sel-product').value.trim();
  currentSheet.device = document.getElementById('sel-device').value.trim();
  
  const locEl = document.getElementById('sheet-location-input');
  if(locEl) currentSheet.location = locEl.value.trim();
  if(!currentSheet.location){
    currentSheet.location = document.getElementById('sel-location').value.trim() || locationForDevice(currentSheet.device) || '미지정';
  }
  currentSheet.updatedAt = new Date().toISOString();

  try{
    await saveSheetById(currentSheetId, currentSheet);
    const metaIdx = sheetIndex.findIndex(s=>s.id===currentSheetId);
    const meta = {
      id: currentSheetId,
      year: currentSheet.year, month: currentSheet.month,
      product: currentSheet.product, device: currentSheet.device, location: currentSheet.location,
      updatedAt: currentSheet.updatedAt
    };
    if(metaIdx>-1) sheetIndex[metaIdx] = meta; else sheetIndex.push(meta);
    await saveSheetIndex();
    setDirty(false);
    isEditingExisting = true;
    rowSnapshotMap = new Map();
    currentSheet.rows.forEach(r => rowSnapshotMap.set(r, JSON.stringify(r)));
    renderRecordList(document.getElementById('record-search-input').value);
    toast('저장되었습니다.');
  }catch(e){
    toast('저장 중 오류가 발생했습니다.', true);
  }
});

document.getElementById('download-btn').addEventListener('click', ()=>{
  if(!currentSheet){ toast('먼저 기록을 불러오세요.', true); return; }
  try{
    const wb = buildWorkbook(currentSheet);
    const fname = `기기가동기록서_${sanitize(currentSheet.device)||'기기'}_${currentSheet.year}${String(currentSheet.month).padStart(2,'0')}.xlsx`;
    XLSX.writeFile(wb, fname);
    toast('엑셀 파일이 다운로드되었습니다.');
  }catch(e){
    console.error(e);
    toast('엑셀 생성 중 오류가 발생했습니다.', true);
  }
});

function buildWorkbook(sheet){
  const rows = sheet.rows.length >= DAYS_MIN_ROWS
    ? sheet.rows
    : [...sheet.rows, ...Array.from({length: DAYS_MIN_ROWS - sheet.rows.length}, blankRow)];

  const firstDataRowIdx = 4;                     
  const lastDataRowIdx = firstDataRowIdx + rows.length - 1;
  const footerLabelRowIdx = lastDataRowIdx + 1;
  const footerBoxEndRowIdx = footerLabelRowIdx + 3; 
  const totalRows = footerBoxEndRowIdx + 1;

  const aoa = Array.from({length: totalRows}, ()=> new Array(9).fill(''));

  aoa[0][0] = '기기가동 기록서';
  aoa[1][0] = `${sheet.year||''}년  ${sheet.month||''}월`;
  aoa[2][0] = '기 기 명';
  aoa[2][2] = sheet.device ? (sheet.product ? `${sheet.device} (${sheet.product})` : sheet.device) : '';
  aoa[2][4] = '설치장소';
  aoa[2][5] = sheet.location || '';
  aoa[3] = ['날짜','사용시간','','제조번호','','작업공정','작업자','확인자','비고'];

  rows.forEach((r, i)=>{
    const ri = firstDataRowIdx + i;
    aoa[ri][0] = r.date || '';
    aoa[ri][1] = r.time || '';
    aoa[ri][3] = r.mfgNo || '';
    aoa[ri][5] = r.process || '';
    aoa[ri][6] = r.worker ? displayName(r.worker) : '';
    aoa[ri][7] = r.checker ? displayName(r.checker) : '';
    aoa[ri][8] = r.note || '';
  });

  aoa[footerLabelRowIdx][0] = sheet.footerNote ? ` 비 고 : ${sheet.footerNote}` : ' 비 고';
  aoa[footerLabelRowIdx][5] = '담당자';
  aoa[footerLabelRowIdx][7] = '승인자';
  aoa[footerLabelRowIdx+1][5] = sheet.manager ? displayName(sheet.manager) : '';
  aoa[footerLabelRowIdx+1][7] = sheet.approver ? displayName(sheet.approver) : '';

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  const merges = [
    {s:{r:0,c:0}, e:{r:0,c:8}},
    {s:{r:1,c:0}, e:{r:1,c:8}},
    {s:{r:2,c:0}, e:{r:2,c:1}},
    {s:{r:2,c:2}, e:{r:2,c:3}},
    {s:{r:2,c:5}, e:{r:2,c:8}},
    {s:{r:3,c:1}, e:{r:3,c:2}},
    {s:{r:3,c:3}, e:{r:3,c:4}},
  ];
  for(let i=0;i<rows.length;i++){
    const ri = firstDataRowIdx + i;
    merges.push({s:{r:ri,c:1}, e:{r:ri,c:2}});
    merges.push({s:{r:ri,c:3}, e:{r:ri,c:4}});
  }
  merges.push({s:{r:footerLabelRowIdx,c:0}, e:{r:footerBoxEndRowIdx,c:4}});
  merges.push({s:{r:footerLabelRowIdx,c:5}, e:{r:footerLabelRowIdx,c:6}});
  merges.push({s:{r:footerLabelRowIdx,c:7}, e:{r:footerLabelRowIdx,c:8}});
  merges.push({s:{r:footerLabelRowIdx+1,c:5}, e:{r:footerBoxEndRowIdx,c:6}});
  merges.push({s:{r:footerLabelRowIdx+1,c:7}, e:{r:footerBoxEndRowIdx,c:8}});
  ws['!merges'] = merges;

  ws['!cols'] = [
    {wch:9},{wch:9},{wch:6},{wch:10},{wch:6},{wch:12},{wch:9},{wch:9},{wch:16}
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  return wb;
}

/* ============================================================
   GOOGLE DRIVE
============================================================ */
const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GDRIVE_FOLDER_NAME = '기기가동기록서';

let gdriveTokenClientObj = null;
let gdriveAccessToken = null;
let gdriveFolderId = null;

function isGDriveConfigured(){
  return !!GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('YOUR_GOOGLE_CLIENT_ID') !== 0;
}

function getGDriveClient(){
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return null;
  if(!isGDriveConfigured()) return null;
  if(!gdriveTokenClientObj){
    gdriveTokenClientObj = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GDRIVE_SCOPE,
      callback: ()=>{}, 
    });
  }
  return gdriveTokenClientObj;
}

function requestGDriveToken(){
  return new Promise((resolve, reject)=>{
    const client = getGDriveClient();
    if(!client){ reject(new Error('NOT_CONFIGURED')); return; }
    client.callback = (resp)=>{
      if(!resp || resp.error){ reject(new Error((resp && resp.error) || 'AUTH_FAILED')); return; }
      gdriveAccessToken = resp.access_token;
      resolve(gdriveAccessToken);
    };
    client.error_callback = (err)=>{ reject(err || new Error('AUTH_FAILED')); };
    client.requestAccessToken({ prompt: '' });
  });
}

async function ensureGDriveToken(){
  if(gdriveAccessToken) return gdriveAccessToken;
  return requestGDriveToken();
}

async function getGDriveFolderId(token){
  if(gdriveFolderId) return gdriveFolderId;
  const q = encodeURIComponent(`name='${GDRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if(!res.ok) throw new Error('DRIVE_API_ERROR');
  const data = await res.json();
  if(data.files && data.files.length > 0){
    gdriveFolderId = data.files[0].id;
    return gdriveFolderId;
  }
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: GDRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  if(!createRes.ok) throw new Error('DRIVE_API_ERROR');
  const created = await createRes.json();
  gdriveFolderId = created.id;
  return gdriveFolderId;
}

async function uploadXlsxToDrive(blob, filename, isRetry){
  const token = await ensureGDriveToken();
  try{
    const folderId = await getGDriveFolderId(token);
    const metadata = { name: filename, parents: [folderId] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', blob);
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token },
      body: form
    });
    if(res.status === 401 && !isRetry){
      gdriveAccessToken = null;
      gdriveFolderId = null;
      return uploadXlsxToDrive(blob, filename, true);
    }
    if(!res.ok) throw new Error('DRIVE_UPLOAD_ERROR');
    return await res.json();
  }catch(e){
    if(!isRetry && e.message === 'DRIVE_API_ERROR'){
      gdriveAccessToken = null;
      gdriveFolderId = null;
      return uploadXlsxToDrive(blob, filename, true);
    }
    throw e;
  }
}

document.getElementById('gdrive-btn').addEventListener('click', async ()=>{
  if(!currentSheet){ toast('먼저 기록을 불러오세요.', true); return; }
  if(!isGDriveConfigured()){
    toast('구글드라이브 연동이 아직 설정되지 않았습니다. (관리자에게 문의하세요)', true);
    return;
  }
  const btn = document.getElementById('gdrive-btn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '업로드 중...';
  try{
    const wb = buildWorkbook(currentSheet);
    const arrayBuf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([arrayBuf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const fname = `기기가동기록서_${sanitize(currentSheet.device)||'기기'}_${currentSheet.year}${String(currentSheet.month).padStart(2,'0')}.xlsx`;
    await uploadXlsxToDrive(blob, fname);
    toast('구글드라이브에 저장되었습니다. ("' + GDRIVE_FOLDER_NAME + '" 폴더 확인)');
  }catch(e){
    console.error(e);
    if(e && e.message === 'NOT_CONFIGURED'){
      toast('구글드라이브 연동이 아직 설정되지 않았습니다. (관리자에게 문의하세요)', true);
    } else {
      toast('구글드라이브 저장 중 오류가 발생했습니다. 다시 시도해주세요.', true);
    }
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
});
