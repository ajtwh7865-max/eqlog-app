<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기기가동 기록서</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --steel-1:#1b1f23;
    --steel-2:#262b30;
    --steel-3:#33393f;
    --steel-line:#3d444b;
    --paper:#f6f1e4;
    --paper-2:#efe8d6;
    --paper-line:#cdbf9c;
    --ink:#242019;
    --ink-soft:#5b5346;
    --amber:#e2a13a;
    --amber-dark:#b97e22;
    --teal:#33645f;
    --teal-dark:#234642;
    --stamp:#a8332a;
    --danger:#a8332a;
    --off-white:#f2ede2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--steel-1);
    font-family:'Noto Sans KR',sans-serif;
    color:var(--off-white);
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:var(--ink);}
  input,select,textarea,button{font-family:inherit;}

  /* ---------- utility bar textures ---------- */
  .hazard-strip{
    height:6px;
    background:repeating-linear-gradient(135deg, var(--amber) 0 14px, var(--steel-1) 14px 28px);
    opacity:.9;
  }

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--steel-2);
    border:1px solid var(--steel-line);
    border-radius:4px;
    padding:0 0 28px 0;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .login-head{
    padding:28px 28px 18px 28px;
    border-bottom:1px solid var(--steel-line);
  }
  .plate-label{
    font-family:'Oswald',sans-serif;
    letter-spacing:.18em;
    font-size:11px;
    color:var(--amber);
    font-weight:600;
    text-transform:uppercase;
  }
  .login-head h1{
    font-family:'Oswald',sans-serif;
    font-size:26px;
    font-weight:600;
    margin:6px 0 0 0;
    letter-spacing:.01em;
  }
  .login-sub{
    color:#9aa1a6;
    font-size:13px;
    margin-top:6px;
  }
  .login-body{padding:22px 28px 0 28px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:#a7adb2;
    margin-bottom:6px;
    font-weight:500;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    font-size:14px;
    outline:none;
  }
  .field input:focus{border-color:var(--amber);}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:3px;
    padding:11px 18px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:filter .15s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--amber);color:#241a08;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:#c7ccd0;border:1px solid var(--steel-line);}
  .btn-ghost:hover{border-color:#7d858c;}
  .btn-teal{background:var(--teal);color:#eef6f4;}
  .btn-teal:hover{filter:brightness(1.12);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .login-error{
    background:rgba(168,51,42,.15);
    border:1px solid rgba(168,51,42,.5);
    color:#ff9a8f;
    font-size:12.5px;
    padding:9px 11px;
    border-radius:3px;
    margin-bottom:14px;
  }
  .login-note{
    font-size:11.5px;
    color:#7d858c;
    padding:16px 28px 0 28px;
    line-height:1.6;
  }
  .login-toggle{
    text-align:center;
    margin-top:16px;
    font-size:12.5px;
    color:#9aa1a6;
  }
  .login-toggle a{color:var(--amber);cursor:pointer;text-decoration:underline;}

  /* ---------- APP SHELL ---------- */
  #app-screen{display:none;min-height:100vh;grid-template-columns:280px 1fr;}
  #app-screen.active{display:grid;}
  .sidebar{
    background:var(--steel-2);
    border-right:1px solid var(--steel-line);
    padding:20px 16px 20px 16px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:14px;
    border-bottom:1px solid var(--steel-line);
  }
  .brand-mark{
    width:34px;height:34px;border-radius:3px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;color:#241a08;font-size:15px;
  }
  .brand-text .t1{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:.03em;}
  .brand-text .t2{font-size:11px;color:#9aa1a6;}
  .side-section-label{
    font-size:11px;
    letter-spacing:.12em;
    color:var(--amber);
    font-weight:600;
    text-transform:uppercase;
  }
  .user-pill{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    padding:9px 11px;
    font-size:12.5px;
  }
  .user-pill span{color:#c7ccd0;}
  .user-pill a{color:#9aa1a6;font-size:12px;cursor:pointer;}
  .user-pill a:hover{color:var(--amber);}
  .readonly-banner{
    background:rgba(226,161,58,.14);
    border:1px solid var(--amber);
    color:var(--amber);
    font-size:11.5px;
    line-height:1.6;
    padding:9px 10px;
    border-radius:3px;
  }
  .status-chip.readonly{border-color:var(--amber);color:var(--amber);}
  .mode-badge{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--steel-line);color:#9aa1a6;}
  .mode-badge.server{border-color:var(--teal);color:#7fd8c9;}
  .mode-badge.local{border-color:var(--danger);color:#ff9a8f;}
  .file-warning{background:rgba(168,51,42,.2);border:1px solid var(--danger);color:#ff9a8f;font-size:12.5px;padding:10px 12px;border-radius:3px;margin-bottom:14px;line-height:1.6;}
  .sign-note.readonly-note{color:var(--amber-dark);}
  input:disabled, select:disabled, textarea:disabled,
  input[readonly], textarea[readonly]{
    opacity:.65;
    cursor:not-allowed;
  }
  .btn:disabled, .sign-btn:disabled, .link-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    pointer-events:none;
  }

  .record-search input{
    width:100%;
    padding:8px 10px;
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    font-size:13px;
    margin-bottom:10px;
  }
  .record-list{
    display:flex;flex-direction:column;gap:6px;
    overflow-y:auto;
    max-height:calc(100vh - 420px);
    min-height:120px;
    padding-right:2px;
  }
  .record-item{
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    padding:9px 10px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .record-item:hover{border-color:var(--amber);}
  .record-item.active{border-color:var(--amber);background:rgba(226,161,58,.09);}
  .record-item .ri-main{font-size:12.5px;line-height:1.5;}
  .record-item .ri-main b{color:var(--off-white);display:block;font-size:13px;}
  .record-item .ri-main span{color:#8f9599;}
  .record-item .ri-del{
    background:none;border:none;color:#6d747a;cursor:pointer;font-size:15px;line-height:1;padding:2px;
  }
  .record-item .ri-del:hover{color:var(--danger);}
  .empty-note{font-size:12px;color:#6d747a;padding:10px 2px;line-height:1.6;}

  .sidebar-foot{margin-top:auto;font-size:11px;color:#6d747a;line-height:1.6;border-top:1px solid var(--steel-line);padding-top:12px;}

  /* ---------- MAIN ---------- */
  .main{padding:26px 34px 60px 34px;overflow-x:auto;}
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:flex-end;
    background:var(--steel-2);
    border:1px solid var(--steel-line);
    border-radius:4px;
    padding:18px 20px;
    margin-bottom:22px;
  }
  .tb-field{display:flex;flex-direction:column;gap:5px;}
  .tb-field label{font-size:11px;color:#9aa1a6;font-weight:500;letter-spacing:.02em;}
  .tb-field select, .tb-field input{
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    padding:9px 10px;
    font-size:13.5px;
    min-width:110px;
  }
  .tb-field input.wide{min-width:170px;}
  .tb-spacer{flex:1;}
  .status-chip{
    font-size:11.5px;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--steel-line);
    color:#9aa1a6;
  }
  .status-chip.dirty{border-color:var(--amber);color:var(--amber);}
  .status-chip.saved{border-color:var(--teal);color:#7fd8c9;}

  /* paper ledger */
  .ledger-wrap{
    background:var(--paper);
    border-radius:4px;
    border:1px solid var(--paper-line);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    color:var(--ink);
    overflow:hidden;
  }
  .ledger-title-bar{
    background:var(--paper-2);
    border-bottom:2px solid var(--ink);
    padding:18px 22px 14px 22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:10px;
  }
  .ledger-title-bar h2{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    margin:0;
    letter-spacing:.02em;
  }
  .ledger-meta{
    font-family:'Roboto Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .ledger-info-row{
    display:flex;
    border-bottom:1px solid var(--paper-line);
    font-size:13px;
  }
  .info-cell{
    padding:9px 14px;
    border-right:1px solid var(--paper-line);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .info-cell:last-child{border-right:none;flex:1;}
  .info-cell .lbl{font-weight:700;color:var(--ink-soft);white-space:nowrap;font-size:12px;}
  .info-cell .val{font-weight:500;}

  table.grid{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.grid thead th{
    background:var(--ink);
    color:var(--off-white);
    font-family:'Oswald',sans-serif;
    font-weight:500;
    letter-spacing:.02em;
    padding:9px 6px;
    border-right:1px solid #3a342a;
    font-size:12.5px;
    position:sticky;top:0;
  }
  table.grid tbody td{
    border-bottom:1px solid var(--paper-line);
    border-right:1px solid var(--paper-line);
    padding:0;
  }
  table.grid tbody tr:nth-child(even){background:rgba(0,0,0,.02);}
  table.grid td input{
    width:100%;
    border:none;
    background:transparent;
    padding:8px 8px;
    font-size:13px;
    color:var(--ink);
    outline:none;
    font-family:'Noto Sans KR',sans-serif;
  }
  table.grid td input:focus{background:rgba(226,161,58,.16);}
  table.grid td select.cell-select{
    width:100%;
    border:none;
    background:transparent;
    padding:8px 6px;
    font-size:13px;
    color:var(--ink);
    outline:none;
    font-family:'Noto Sans KR',sans-serif;
  }
  table.grid td select.cell-select:focus{background:rgba(226,161,58,.16);}
  td.sign-cell{padding:4px 6px;text-align:center;}
  .sign-btn{
    border:1px solid var(--teal-dark);
    background:#eef6f4;
    color:var(--teal-dark);
    font-size:12px;
    font-weight:600;
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .sign-btn:hover{background:var(--teal);color:#fff;}
  .sign-filled{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    color:var(--ink);
  }
  .sign-filled .sign-name{
    font-family:'Oswald',sans-serif;
    letter-spacing:.01em;
  }
  .sign-filled .sign-cancel{
    border:none;background:none;color:#a68f6a;cursor:pointer;font-size:12px;padding:0 2px;
  }
  .sign-filled .sign-cancel:hover{color:var(--danger);}
  .sign-note{
    font-size:11px;
    color:var(--ink-soft);
    font-style:italic;
  }
  table.grid td.col-date input, table.grid td.col-time input{font-family:'Roboto Mono',monospace;}
  td.col-del{text-align:center;width:34px;}
  td.col-del button{
    border:none;background:none;color:#a68f6a;cursor:pointer;font-size:16px;
  }
  td.col-del button:hover{color:var(--danger);}

  .grid-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    background:var(--paper-2);
    border-top:1px solid var(--paper-line);
    flex-wrap:wrap;
    gap:10px;
  }
  .grid-actions .left-actions{display:flex;gap:8px;}
  .link-btn{
    background:none;border:none;color:var(--teal-dark);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;
  }

  .footer-block{
    display:grid;
    grid-template-columns:1.4fr .8fr .8fr;
    border-top:2px solid var(--ink);
  }
  .footer-cell{
    border-right:1px solid var(--paper-line);
    padding:10px 14px 14px 14px;
  }
  .footer-cell:last-child{border-right:none;}
  .footer-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.05em;
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .footer-cell textarea{
    width:100%;
    min-height:64px;
    border:1px solid var(--paper-line);
    background:#fffdf7;
    border-radius:3px;
    padding:8px;
    font-size:13px;
    resize:vertical;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--ink);
  }
  .sign-box{
    position:relative;
    min-height:64px;
    border:1px solid var(--paper-line);
    background:#fffdf7;
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
  }
  .sign-box input, .sign-box select.sign-select{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-size:15px;
    outline:none;
    color:var(--ink);
  }
  .stamp{
    position:absolute;
    right:8px;
    bottom:6px;
    width:40px;height:40px;
    border:2.5px solid var(--stamp);
    border-radius:50%;
    color:var(--stamp);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:700;
    transform:rotate(-14deg);
    opacity:.85;
    letter-spacing:.02em;
    pointer-events:none;
  }

  .bottom-bar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
  }

  .storage-note{
    font-size:11.5px;
    color:#6d747a;
    margin-top:10px;
    line-height:1.6;
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--teal);
    color:#eef6f4;
    padding:11px 20px;
    border-radius:4px;
    font-size:13.5px;
    font-weight:600;
    box-shadow:0 10px 26px rgba(0,0,0,.35);
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--danger);}

  @media (max-width:880px){
    #app-screen.active{grid-template-columns:1fr;}
    .sidebar{border-right:none;border-bottom:1px solid var(--steel-line);}
    .main{padding:20px 16px 60px 16px;}
    .footer-block{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="hazard-strip"></div>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-head">
      <div class="plate-label">현장 설비 관리</div>
      <h1>기기가동 기록서</h1>
      <div class="login-sub">아이디와 비밀번호로 로그인하세요</div>
    </div>
    <div class="login-body">
      <div id="login-error-slot"></div>
      <form id="login-form">
        <div class="field">
          <label>아이디</label>
          <input type="text" id="login-username" autocomplete="username" required>
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>
      <div class="login-toggle" id="login-toggle-slot"></div>
    </div>
    <div class="login-note" id="login-note-slot"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-screen">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">기</div>
      <div class="brand-text">
        <div class="t1">기기가동 기록서</div>
        <div class="t2">현장 데이터 관리</div>
      </div>
    </div>

    <div class="user-pill">
      <span>👤 <b id="current-user-label"></b></span>
      <a id="logout-btn">로그아웃</a>
    </div>
    <div class="readonly-banner" id="readonly-banner" style="display:none;">
      ⛔ 동시 접속이 금지되어 있습니다. 다른 사용자가 로그아웃한 후 다시 시도하세요.
    </div>

    <div>
      <div class="side-section-label" style="margin-bottom:8px;">저장된 기록</div>
      <div class="record-search">
        <input type="text" id="record-search-input" placeholder="기기명, 설치장소 검색">
      </div>
      <div class="record-list" id="record-list"></div>
    </div>

    <div class="sidebar-foot" id="sidebar-foot-note">
      데이터는 이 앱을 사용하는 모든 사용자에게 공유됩니다. 같은 현장/팀에서 함께 사용하는 공용 저장소입니다.
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="tb-field">
        <label>년도</label>
        <select id="sel-year"></select>
      </div>
      <div class="tb-field">
        <label>월</label>
        <select id="sel-month"></select>
      </div>
      <div class="tb-field">
        <label>품목명</label>
        <select id="sel-product" class="wide"></select>
      </div>
      <div class="tb-field">
        <label>기기명</label>
        <select id="sel-device" class="wide"></select>
      </div>
      <div class="tb-field">
        <label>설치장소</label>
        <select id="sel-location" class="wide"></select>
      </div>
      <button class="btn btn-teal" id="load-btn">불러오기 / 새 기록</button>
      <div class="tb-spacer"></div>
      <span class="status-chip" id="status-chip">기록을 불러오세요</span>
      <span class="mode-badge" id="mode-badge"></span>
    </div>

    <div class="readonly-banner" id="sheet-lock-banner" style="display:none;"></div>

    <div id="ledger-area"></div>

    <div class="bottom-bar" id="bottom-actions" style="display:none;">
      <button class="btn btn-ghost" id="download-btn">📥 엑셀(.xlsx) 다운로드</button>
      <button class="btn btn-ghost" id="gdrive-btn">☁️ 구글드라이브 저장</button>

let mySessionId = null;

let sessionHeartbeatTimer = null;

const SESSION_STALE_MS = 25000;

let readOnlyRecheckTimer = null;

/* ============================================================

/* ============================================================
   STORAGE LAYER
============================================================ */
const LS_PREFIX = 'eqlog__';
let storageModeNotified = false;
let useServerApi = false;
let serverShareUrls = [];

function hasArtifactStorage(){
  return typeof window.storage !== 'undefined'
      && window.storage
      && typeof window.storage.get === 'function';
}

function storageModeLabel(){
  if(useServerApi) return 'server';
  if(hasArtifactStorage()) return 'artifact';
  return 'local';
}

async function initStorageBackend(){
  if(location.protocol === 'file:'){
    useServerApi = false;
    serverShareUrls = [];
    return;
  }
  try{
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), 3000) : null;
    const r = await fetch('/api/health', ctrl ? { signal: ctrl.signal } : {});
    if(timer) clearTimeout(timer);
    useServerApi = r.ok;
    if(r.ok){
      const info = await r.json();
      serverShareUrls = info.shareUrls || [];
    }
  }catch(e){
    useServerApi = false;
    serverShareUrls = [];
  }
}

async function apiJson(path, opts={}){
  const r = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  if(!r.ok) throw new Error('API ' + r.status);
  return r.json();
}

function notifyStorageMode(){
  if(storageModeNotified) return;
  storageModeNotified = true;
  const mode = storageModeLabel();
  if(mode === 'local'){
    console.info('[기기가동 기록서] 독립 실행: 이 PC 브라우저에만 저장됩니다. 회사 공유는 시작.bat 서버로 접속하세요.');
  } else if(mode === 'server'){
    console.info('[기기가동 기록서] 회사 공유망 서버 연결됨.');
  }
}

function updateModeBadge(){
  const badge = document.getElementById('mode-badge');
  if(!badge) return;
  const mode = storageModeLabel();
  if(mode === 'server'){
    badge.textContent = '공유 서버 연결됨';
    badge.className = 'mode-badge server';
  } else if(mode === 'local'){
    badge.textContent = '단독 실행 (공유 안 됨)';
    badge.className = 'mode-badge local';
  } else {
    badge.textContent = '공유 저장소';
    badge.className = 'mode-badge';
  }
}

async function stGet(key, shared){
  notifyStorageMode();
  if(useServerApi){
    try{
      const data = await apiJson('/api/kv/' + encodeURIComponent(key));
      if(data.value === null || data.value === undefined) return null;
      return { key, value: data.value, shared: !!shared };
    }catch(e){ return null; }
  }
  if(hasArtifactStorage()){
    try{ return await window.storage.get(key, shared); }
    catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw===null ? null : {key, value:raw, shared:!!shared};
  }catch(e){ return null; }
}
async function stSet(key, value, shared){
  notifyStorageMode();
  if(useServerApi){
    try{
      await apiJson('/api/kv/' + encodeURIComponent(key), {
        method: 'PUT',
        body: JSON.stringify({ value }),
      });
      return { key, value, shared: !!shared };
    }catch(e){ return null; }
  }
  if(hasArtifactStorage()){
    try{ return await window.storage.set(key, value, shared); }
    catch(e){ return null; }
  }
  try{
    localStorage.setItem(LS_PREFIX+key, value);
    return {key, value, shared:!!shared};
  }catch(e){ return null; }
}
async function stDelete(key, shared){
  notifyStorageMode();
  if(useServerApi){
    try{
      await apiJson('/api/kv/' + encodeURIComponent(key), { method: 'DELETE' });
      return { key, deleted: true, shared: !!shared };
    }catch(e){ return null; }
  }
  if(hasArtifactStorage()){
    try{ return await window.storage.delete(key, shared); }
    catch(e){ return null; }
  }
  try{
    localStorage.removeItem(LS_PREFIX+key);
    return {key, deleted:true, shared:!!shared};
  }catch(e){ return null; }
}

async function loadUsers(){
  const r = await stGet('users', true);
  try{ return r ? JSON.parse(r.value) : []; }catch(e){ return []; }
}

/* ============================================================
   GLOBAL SESSION (동시 접속 제한 비활성화 적용)
============================================================ */
function makeSessionId(){
  return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

function isSessionAlive(s){
  return s && s.sessionId && (Date.now() - (s.updatedAt || 0) < SESSION_STALE_MS);
}

async function loadGlobalSession(){
  if(useServerApi){
    try{
      const data = await apiJson('/api/global-session');
      return data.session || null;
    }catch(e){ return null; }
  }
  const r = await stGet(GLOBAL_SESSION_KEY, true);
  try{ return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
}

async function saveGlobalSession(data){
  if(useServerApi){
    try{
      await apiJson('/api/global-session', {
        method: 'POST',
        body: JSON.stringify({ username: data.username, sessionId: data.sessionId }),
      });
      return;
    }catch(e){ /* fallback */ }
  }
  await stSet(GLOBAL_SESSION_KEY, JSON.stringify(data), true);
}

async function deleteGlobalSession(){
  if(useServerApi){
    try{
      await apiJson('/api/global-session', {
        method: 'DELETE',
        body: JSON.stringify({ sessionId: mySessionId }),
      });
      return;
    }catch(e){ /* fallback */ }
  }
  await stDelete(GLOBAL_SESSION_KEY, true);
}

/** @returns {{ok:boolean, blockedBy?:string}} */
async function establishSession(){
  mySessionId = makeSessionId();
  loginBlockedBy = null;
  const now0 = Date.now();

  // [동시 접속 수정] 중복 로그인을 차단하던 검증 조건문을 비활성화합니다.
  /*
  const existing = await loadGlobalSession();
  if(isSessionAlive(existing) && existing.sessionId !== mySessionId){
    loginBlockedBy = existing.username;
    mySessionId = null;
    return { ok: false, blockedBy: existing.username };
  }
  */

  await saveGlobalSession({ username: currentUser, sessionId: mySessionId, updatedAt: now0 });
  await new Promise(resolve => setTimeout(resolve, 400 + Math.random() * 300));
  
  // 동시 접속이 허용되므로, 무조건 성공 반환 처리합니다.
  isPrimarySession = true;
  isReadOnly = false;
  startSessionHeartbeat();
  return { ok: true };
}

function startSessionHeartbeat(){
  stopSessionHeartbeat();
  sessionHeartbeatTimer = setInterval(async ()=>{
    if(!currentUser || !isPrimarySession || !mySessionId) return;
    if(useServerApi){
      try{
        const data = await apiJson('/api/global-session/heartbeat', {
          method: 'POST',
          body: JSON.stringify({ sessionId: mySessionId }),
        });
        if(data.lost){
          // 동시 접속 상태에서 세션이 다른 기기에 의해 바뀌어도 로그아웃 되지 않도록 유연하게 대처합니다.
        }
      }catch(e){ /* ignore */ }
    } else {
      await saveGlobalSession({ username: currentUser, sessionId: mySessionId, updatedAt: Date.now() });
    }
  }, SESSION_HEARTBEAT_MS);
}

function stopSessionHeartbeat(){
  if(sessionHeartbeatTimer){ clearInterval(sessionHeartbeatTimer); sessionHeartbeatTimer = null; }
}

async function releaseSession(){
  stopSessionHeartbeat();
  if(currentUser && isPrimarySession && mySessionId){
    const existing = await loadGlobalSession();
    if(!existing || existing.sessionId === mySessionId){
      await deleteGlobalSession();
    }
  }
  isPrimarySession = false;
  mySessionId = null;
}

function stopReadOnlyRecheck(){
  if(readOnlyRecheckTimer){ clearInterval(readOnlyRecheckTimer); readOnlyRecheckTimer = null; }
}

  const saveBtn = document.getElementById('save-btn');
  if(saveBtn) saveBtn.disabled = false;
}

function isEditBlocked(){
  return false;
}

async function acquireSheetLock(id){ /* no-op */ }

/* ============================================================
   LOGIN
============================================================ */
function renderLoginExtras(){
  // [구문 에러 해결] 끊겼던 document.getElementById를 완전히 복구하였습니다.
  const noteSlot = document.getElementById('login-note-slot');
  const toggleSlot = document.getElementById('login-toggle-slot');
  const errorSlot = document.getElementById('login-error-slot');
  
  errorSlot.innerHTML = ''; // 초기화

  if(signupMode){
    toggleSlot.innerHTML = '이미 계정이 있나요? <a id="go-login">로그인</a>';
    noteSlot.innerHTML = '팀 공용 저장소입니다.<br>현장에서 사용할 아이디와 비밀번호를 등록하세요.';
    document.querySelector('.login-head h1').textContent = '계정 생성';
    document.querySelector('.login-sub').textContent = '사용할 아이디와 비밀번호를 입력하세요';
    document.querySelector('#login-form .btn').textContent = '가입하기';
  } else {
    toggleSlot.innerHTML = '계정이 없나요? <a id="go-signup">가입하기</a>';
    noteSlot.innerHTML = '현장 설비 관리용 기기가동 기록서 시스템입니다.<br>사전에 등록된 계정으로 로그인해 주세요.';
    document.querySelector('.login-head h1').textContent = '기기가동 기록서';
    document.querySelector('.login-sub').textContent = '아이디와 비밀번호로 로그인하세요';
    document.querySelector('#login-form .btn').textContent = '로그인';
  }
  
  const gl = document.getElementById('go-login');
  if(gl) gl.onclick = () => { signupMode = false; renderLoginExtras(); };
  const gs = document.getElementById('go-signup');
  if(gs) gs.onclick = () => { signupMode = true; renderLoginExtras(); };
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value.trim();
  const errorSlot = document.getElementById('login-error-slot');
  errorSlot.innerHTML = '';
  
  if(!u || !p) return;
  
  await initStorageBackend();
  let users = await loadUsers();
  
  if(signupMode){
    if(users.find(x => x.id === u)){
      errorSlot.innerHTML = '<div class="login-error">이미 존재하는 아이디입니다.</div>';
      return;
    }
    users.push({ id: u, pw: p });
    await saveUsers(users);
    toast('가입 완료! 로그인 되었습니다.', false);
    signupMode = false;
  } else {
    // [로그인 로직 오류 수정] 가입 및 사전 지정된 아이디가 모두 일관되게 로그인될 수 있도록 변경
    const match = users.find(x => x.id === u && x.pw === p);
    const isHardcoded = WORKER_CODES.includes(u) || MANAGER_CODES.includes(u) || APPROVER_CODES.includes(u);
    
    // 데이터베이스(users)에 아무 정보도 저장되지 않은 최초 상태이고 하드코딩된 아이디인 경우만 무검증 임시 로그인을 허용
    const isFirstRun = isHardcoded && users.length === 0;

    if(!match && !isFirstRun){
      errorSlot.innerHTML = '<div class="login-error">아이디 또는 비밀번호가 일치하지 않습니다.</div>';
      return;
    }
  }
  
  currentUser = u;
  const sess = await establishSession();
  
  if(!sess.ok){
     currentUser = null;
     errorSlot.innerHTML = `<div class="login-error">현재 다른 사용자(<b>${sess.blockedBy}</b>)가 접속 중입니다.<br>동시 접속이 제한되어 있습니다.</div>`;
     return;
  }
  
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('current-user-label').textContent = displayName(currentUser) || currentUser;
  
  await initApp();
});

document.getElementById('logout-btn').addEventListener('click', async () => {
   await releaseSession();
   location.reload();
});

window.addEventListener('beforeunload', () => {
   if(currentUser) releaseSession();
});


/* ============================================================
   APP LOGIC
============================================================ */
async function initApp(){
  await loadSheetIndex();
  
  const sy = document.getElementById('sel-year');
  const sm = document.getElementById('sel-month');
  const curYear = new Date().getFullYear();
  
  for(let y = curYear - 2; y <= curYear + 2; y++){
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y + '년';
    sy.appendChild(opt);
  }
  sy.value = curYear;
  
  for(let m = 1; m <= 12; m++){
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m + '월';
    sm.appendChild(opt);
  }
  sm.value = new Date().getMonth() + 1;
  
  const sp = document.getElementById('sel-product');
  PRODUCT_CODES.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    sp.appendChild(opt);
  });
  
  const sd = document.getElementById('sel-device');
  const sl = document.getElementById('sel-location');
  
  function updateDevices(){
    sd.innerHTML = '';
    const devices = PRODUCT_DEVICE_MAP[sp.value] || [];
    devices.forEach(d => {
       const opt = document.createElement('option');
       opt.value = d;
       opt.textContent = d;
       sd.appendChild(opt);
    });
    updateLocation();
  }
  
  function updateLocation(){
    sl.innerHTML = '';
    const loc = DEVICE_LOCATION_MAP[sd.value] || '';
    if(loc){
       const opt = document.createElement('option');
       opt.value = loc;
       opt.textContent = loc;
       sl.appendChild(opt);
    } else {
       LOCATION_CODES.forEach(l => {
         const opt = document.createElement('option');
         opt.value = l;
         opt.textContent = l;
         sl.appendChild(opt);
       });
    }
  }
  
  sp.addEventListener('change', updateDevices);
  sd.addEventListener('change', updateLocation);
  
  updateDevices();
  renderRecordList();
  
  document.getElementById('load-btn').addEventListener('click', loadCurrentSelection);
  document.getElementById('save-btn').addEventListener('click', saveCurrentSheet);
  document.getElementById('download-btn').addEventListener('click', downloadExcel);
  document.getElementById('gdrive-btn').addEventListener('click', () => {
     toast('구글 드라이브 연동은 별도의 API 설정이 필요합니다.', true);
  });
  
  document.getElementById('record-search-input').addEventListener('input', renderRecordList);
  
  updateModeBadge();
}

function renderRecordList(){
  const listDiv = document.getElementById('record-list');
  listDiv.innerHTML = '';
  const term = document.getElementById('record-search-input').value.toLowerCase().trim();
  
  const filtered = sheetIndex.filter(s => {
     const t = `${s.year} ${s.month} ${s.device} ${s.location} ${s.product}`.toLowerCase();
     return t.includes(term);
  });
  
  if(filtered.length === 0){
     listDiv.innerHTML = '<div class="empty-note">저장된 기록이 없습니다.</div>';
     return;
  }
  
  filtered.sort((a,b) => {
     if(b.year !== a.year) return b.year - a.year;
     if(b.month !== a.month) return b.month - a.month;
     return a.id.localeCompare(b.id);
  });
  
  filtered.forEach(s => {
     const div = document.createElement('div');
     div.className = 'record-item';
     if(currentSheetId === s.id) div.classList.add('active');
     
     const info = document.createElement('div');
     info.className = 'ri-main';
     info.innerHTML = `<b>${s.year}년 ${s.month}월 | ${s.product}</b><span>${s.device} / ${s.location}</span>`;
     info.onclick = () => openSheet(s.id);
     
     const delBtn = document.createElement('button');
     delBtn.className = 'ri-del';
     delBtn.innerHTML = '×';
     delBtn.title = '삭제';
     delBtn.onclick = async (e) => {
        e.stopPropagation();
        if(confirm(`[${s.device} / ${s.year}년 ${s.month}월] 기록을 완전히 삭제하시겠습니까?`)){
           await deleteSheetById(s.id);
           sheetIndex = sheetIndex.filter(x => x.id !== s.id);
           await saveSheetIndex();
           if(currentSheetId === s.id){
              currentSheet = null;
              currentSheetId = null;
              document.getElementById('ledger-area').innerHTML = '';
              document.getElementById('bottom-actions').style.display = 'none';
              setDirty(false);
           }
           renderRecordList();
           toast('삭제되었습니다.', false);
        }
     };
     
     div.appendChild(info);
     div.appendChild(delBtn);
     listDiv.appendChild(div);
  });
}

async function loadCurrentSelection(){
  const y = document.getElementById('sel-year').value;
  const m = document.getElementById('sel-month').value;
  const p = document.getElementById('sel-product').value;
  const d = document.getElementById('sel-device').value;
  const l = document.getElementById('sel-location').value;
  
  const id = makeSheetId(y, m, d, l);
  await openSheet(id, { y, m, p, d, l });
}

async function openSheet(id, fallbackMeta){
  const saved = await loadSheetById(id);
  currentSheetId = id;
  
  if(saved){
     currentSheet = saved;
     isEditingExisting = true;
  } else if(fallbackMeta) {
     currentSheet = {
        id: id,
        year: fallbackMeta.y,
        month: fallbackMeta.m,
        product: fallbackMeta.p,
        device: fallbackMeta.d,
        location: fallbackMeta.l,
        rows: Array.from({length: DAYS_MIN_ROWS}, blankRow),
        notes: '',
        workerSign: null,
        approverSign: null
     };
     isEditingExisting = false;
  } else {
     toast('기록을 찾을 수 없습니다.', true);
     return;
  }
  
  // 변경점 추적 스냅샷
  rowSnapshotMap.clear();
  currentSheet.rows.forEach(r => rowSnapshotMap.set(r, JSON.stringify(r)));
  
  document.getElementById('bottom-actions').style.display = 'flex';
  setDirty(false);
  renderLedger();
  renderRecordList();
}

function renderLedger(){
  const area = document.getElementById('ledger-area');
  area.innerHTML = `
    <div class="ledger-wrap">
      <div class="ledger-title-bar">
         <h2>기기가동 기록서</h2>
         <div class="ledger-meta">DOC-ID: ${currentSheetId}</div>
      </div>
      <div class="ledger-info-row">
         <div class="info-cell"><span class="lbl">년월</span><span class="val">${currentSheet.year}년 ${currentSheet.month}월</span></div>
         <div class="info-cell"><span class="lbl">품목명</span><span class="val">${currentSheet.product}</span></div>
         <div class="info-cell"><span class="lbl">기기명</span><span class="val">${currentSheet.device}</span></div>
         <div class="info-cell"><span class="lbl">설치장소</span><span class="val">${currentSheet.location}</span></div>
      </div>
      <table class="grid" id="ledger-grid">
         <thead>
           <tr>
             <th style="width:60px">일자</th>
             <th style="width:110px">가동시간 (시:분)</th>
             <th style="width:140px">제조번호</th>
             <th style="width:140px">공정명</th>
             <th style="width:80px">작업자</th>
             <th style="width:80px">확인자</th>
             <th>비고</th>
             <th class="col-del"></th>
           </tr>
         </thead>
         <tbody id="ledger-tbody"></tbody>
      </table>
      <div class="grid-actions">
         <div class="left-actions">
           <button class="link-btn" id="add-row-btn">+ 행 추가하기</button>
         </div>
      </div>
      <div class="footer-block">
         <div class="footer-cell">
           <div class="footer-label">특기사항</div>
           <textarea id="sheet-notes" placeholder="이상발생 및 조치사항 등 기재란"></textarea>
         </div>
         <div class="footer-cell">
           <div class="footer-label">작성자 (작업자)</div>
           <div class="sign-box" id="sign-box-worker"></div>
         </div>
         <div class="footer-cell">
           <div class="footer-label">승인자 (팀장/관리자)</div>
           <div class="sign-box" id="sign-box-approver"></div>
         </div>
      </div>
    </div>
  `;
  
  const tbody = document.getElementById('ledger-tbody');
  currentSheet.rows.forEach((r, idx) => {
     tbody.appendChild(createRowTR(r, idx));
  });
  
  document.getElementById('add-row-btn').addEventListener('click', () => {
     const newRow = blankRow();
     currentSheet.rows.push(newRow);
     rowSnapshotMap.set(newRow, JSON.stringify(newRow));
     tbody.appendChild(createRowTR(newRow, currentSheet.rows.length - 1));
     setDirty(true);
  });
  
  const notesEl = document.getElementById('sheet-notes');
  notesEl.value = currentSheet.notes || '';
  notesEl.addEventListener('input', () => {
     currentSheet.notes = notesEl.value;
     setDirty(true);
  });
  
  renderSignatures();
}

function createRowTR(rowObj, idx){
  const tr = document.createElement('tr');
  
  const mkInput = (key, placeholder) => {
     const td = document.createElement('td');
     td.className = key === 'date' ? 'col-date' : key === 'time' ? 'col-time' : '';
     const inp = document.createElement('input');
     inp.type = 'text';
     inp.value = rowObj[key] || '';
     inp.placeholder = placeholder || '';
     inp.addEventListener('input', () => {
        rowObj[key] = inp.value;
        if(JSON.stringify(rowObj) !== rowSnapshotMap.get(rowObj)){
           setDirty(true);
        }
     });
     td.appendChild(inp);
     return td;
  };
  
  tr.appendChild(mkInput('date', '일자'));
  tr.appendChild(mkInput('time', '00:00~00:00'));
  tr.appendChild(mkInput('mfgNo', '제조번호 입력'));
  tr.appendChild(mkInput('process', '공정명 입력'));
  tr.appendChild(mkInput('worker', '이름'));
  tr.appendChild(mkInput('checker', '이름'));
  tr.appendChild(mkInput('note', '비고'));
  
  const delTd = document.createElement('td');
  delTd.className = 'col-del';
  const delBtn = document.createElement('button');
  delBtn.innerHTML = '×';
  delBtn.title = '이 행 지우기';
  delBtn.onclick = () => {
     Object.assign(rowObj, blankRow());
     renderLedger();
     setDirty(true);
  };
  delTd.appendChild(delBtn);
  tr.appendChild(delTd);
  
  return tr;
}

function renderSignatures(){
   const renderBox = (boxId, signObj, signKey, label) => {
      const box = document.getElementById(boxId);
      box.innerHTML = '';
      if(signObj){
         box.innerHTML = `
           <div class="sign-filled">
             <span class="sign-name">${signObj.name}</span>
             <button class="sign-cancel" title="서명 취소">✖</button>
           </div>
           <div class="stamp">서명완료</div>
         `;
         box.querySelector('.sign-cancel').onclick = () => {
            currentSheet[signKey] = null;
            setDirty(true);
            renderSignatures();
         };
      } else {
         const btn = document.createElement('button');
         btn.className = 'sign-btn';
         btn.textContent = label + ' 서명하기';
         btn.onclick = () => {
            currentSheet[signKey] = {
               user: currentUser,
               name: displayName(currentUser) || currentUser,
               ts: Date.now()
            };
            setDirty(true);
            renderSignatures();
         };
         box.appendChild(btn);
      }
   };
   
   renderBox('sign-box-worker', currentSheet.workerSign, 'workerSign', '작성자');
   renderBox('sign-box-approver', currentSheet.approverSign, 'approverSign', '승인자');
}

async function saveCurrentSheet(){
   if(!currentSheet || !currentSheetId) return;
   
   await saveSheetById(currentSheetId, currentSheet);
   
   const existingIdx = sheetIndex.findIndex(x => x.id === currentSheetId);
   const meta = {
      id: currentSheetId,
      year: currentSheet.year,
      month: currentSheet.month,
      product: currentSheet.product,
      device: currentSheet.device,
      location: currentSheet.location,
      updated: Date.now()
   };
   
   if(existingIdx >= 0){
      sheetIndex[existingIdx] = meta;
   } else {
      sheetIndex.push(meta);
   }
   await saveSheetIndex();
   
   rowSnapshotMap.clear();
   currentSheet.rows.forEach(r => rowSnapshotMap.set(r, JSON.stringify(r)));
   
   setDirty(false);
   renderRecordList();
   toast('성공적으로 저장되었습니다.', false);
}

function downloadExcel(){
   if(!currentSheet) return;
   try {
     const wb = XLSX.utils.book_new();
     const data = [
       ['기기가동 기록서'],
       [`년월: ${currentSheet.year}년 ${currentSheet.month}월`, `품목명: ${currentSheet.product}`, `기기명: ${currentSheet.device}`, `설치장소: ${currentSheet.location}`],
       [''],
       ['일자', '가동시간 (시:분)', '제조번호', '공정명', '작업자', '확인자', '비고']
     ];
     
     currentSheet.rows.forEach(r => {
       data.push([r.date, r.time, r.mfgNo, r.process, r.worker, r.checker, r.note]);
     });
     
     data.push(['']);
     data.push(['특기사항', currentSheet.notes || '']);
     data.push(['작성자 서명', currentSheet.workerSign ? currentSheet.workerSign.name : '(서명 안 됨)']);
     data.push(['승인자 서명', currentSheet.approverSign ? currentSheet.approverSign.name : '(서명 안 됨)']);
     
     const ws = XLSX.utils.aoa_to_sheet(data);
     
     if(!ws['!merges']) ws['!merges'] = [];
     ws['!merges'].push({ s: {r:0, c:0}, e: {r:0, c:6} });
     
     ws['!cols'] = [
       { wch: 8 },
       { wch: 18 },
       { wch: 22 },
       { wch: 20 },
       { wch: 12 },
       { wch: 12 },
       { wch: 35 }
     ];
     
     XLSX.utils.book_append_sheet(wb, ws, "기록서");
     XLSX.writeFile(wb, `${currentSheetId}.xlsx`);
     toast('엑셀 다운로드가 시작되었습니다.', false);
   } catch(e) {
     console.error(e);
     toast('엑셀 파일 생성 중 오류가 발생했습니다.', true);
   }
}

renderLoginExtras();
