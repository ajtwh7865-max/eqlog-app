<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기기가동 기록서</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --steel-1:#1b1f23;
    --steel-2:#262b30;
    --steel-3:#33393f;
    --steel-line:#3d444b;
    --paper:#f6f1e4;
    --paper-2:#efe8d6;
    --paper-line:#cdbf9c;
    --ink:#242019;
    --ink-soft:#5b5346;
    --amber:#e2a13a;
    --amber-dark:#b97e22;
    --teal:#33645f;
    --teal-dark:#234642;
    --stamp:#a8332a;
    --danger:#a8332a;
    --off-white:#f2ede2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--steel-1);
    font-family:'Noto Sans KR',sans-serif;
    color:var(--off-white);
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:var(--ink);}
  input,select,textarea,button{font-family:inherit;}

  /* ---------- utility bar textures ---------- */
  .hazard-strip{
    height:6px;
    background:repeating-linear-gradient(135deg, var(--amber) 0 14px, var(--steel-1) 14px 28px);
    opacity:.9;
  }

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--steel-2);
    border:1px solid var(--steel-line);
    border-radius:4px;
    padding:0 0 28px 0;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .login-head{
    padding:28px 28px 18px 28px;
    border-bottom:1px solid var(--steel-line);
  }
  .plate-label{
    font-family:'Oswald',sans-serif;
    letter-spacing:.18em;
    font-size:11px;
    color:var(--amber);
    font-weight:600;
    text-transform:uppercase;
  }
  .login-head h1{
    font-family:'Oswald',sans-serif;
    font-size:26px;
    font-weight:600;
    margin:6px 0 0 0;
    letter-spacing:.01em;
  }
  .login-sub{
    color:#9aa1a6;
    font-size:13px;
    margin-top:6px;
  }
  .login-body{padding:22px 28px 0 28px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:#a7adb2;
    margin-bottom:6px;
    font-weight:500;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    font-size:14px;
    outline:none;
  }
  .field input:focus{border-color:var(--amber);}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:3px;
    padding:11px 18px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:filter .15s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--amber);color:#241a08;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:#c7ccd0;border:1px solid var(--steel-line);}
  .btn-ghost:hover{border-color:#7d858c;}
  .btn-teal{background:var(--teal);color:#eef6f4;}
  .btn-teal:hover{filter:brightness(1.12);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .login-error{
    background:rgba(168,51,42,.15);
    border:1px solid rgba(168,51,42,.5);
    color:#ff9a8f;
    font-size:12.5px;
    padding:9px 11px;
    border-radius:3px;
    margin-bottom:14px;
  }
  .login-note{
    font-size:11.5px;
    color:#7d858c;
    padding:16px 28px 0 28px;
    line-height:1.6;
  }
  .login-toggle{
    text-align:center;
    margin-top:16px;
    font-size:12.5px;
    color:#9aa1a6;
  }
  .login-toggle a{color:var(--amber);cursor:pointer;text-decoration:underline;}

  /* ---------- APP SHELL ---------- */
  #app-screen{display:none;min-height:100vh;grid-template-columns:280px 1fr;}
  #app-screen.active{display:grid;}
  .sidebar{
    background:var(--steel-2);
    border-right:1px solid var(--steel-line);
    padding:20px 16px 20px 16px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:14px;
    border-bottom:1px solid var(--steel-line);
  }
  .brand-mark{
    width:34px;height:34px;border-radius:3px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;color:#241a08;font-size:15px;
  }
  .brand-text .t1{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:.03em;}
  .brand-text .t2{font-size:11px;color:#9aa1a6;}
  .side-section-label{
    font-size:11px;
    letter-spacing:.12em;
    color:var(--amber);
    font-weight:600;
    text-transform:uppercase;
  }
  .user-pill{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    padding:9px 11px;
    font-size:12.5px;
  }
  .user-pill span{color:#c7ccd0;}
  .user-pill a{color:#9aa1a6;font-size:12px;cursor:pointer;}
  .user-pill a:hover{color:var(--amber);}
  .readonly-banner{
    background:rgba(226,161,58,.14);
    border:1px solid var(--amber);
    color:var(--amber);
    font-size:11.5px;
    line-height:1.6;
    padding:9px 10px;
    border-radius:3px;
  }
  .status-chip.readonly{border-color:var(--amber);color:var(--amber);}
  .mode-badge{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--steel-line);color:#9aa1a6;}
  .mode-badge.server{border-color:var(--teal);color:#7fd8c9;}
  .mode-badge.local{border-color:var(--danger);color:#ff9a8f;}
  .file-warning{background:rgba(168,51,42,.2);border:1px solid var(--danger);color:#ff9a8f;font-size:12.5px;padding:10px 12px;border-radius:3px;margin-bottom:14px;line-height:1.6;}
  .mode-badge{
    font-size:11px;padding:4px 10px;border-radius:20px;
    border:1px solid var(--steel-line);color:#9aa1a6;
  }
  .mode-badge.server{border-color:var(--teal);color:#7fd8c9;}
  .mode-badge.local{border-color:var(--danger);color:#ff9a8f;}
  .file-warning{
    background:rgba(168,51,42,.2);border:1px solid var(--danger);
    color:#ff9a8f;font-size:12.5px;padding:10px 12px;border-radius:3px;
    margin-bottom:14px;line-height:1.6;
  }
  .sign-note.readonly-note{color:var(--amber-dark);}
  input:disabled, select:disabled, textarea:disabled,
  input[readonly], textarea[readonly]{
    opacity:.65;
    cursor:not-allowed;
  }
  .btn:disabled, .sign-btn:disabled, .link-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    pointer-events:none;
  }

  .record-search input{
    width:100%;
    padding:8px 10px;
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    font-size:13px;
    margin-bottom:10px;
  }
  .record-list{
    display:flex;flex-direction:column;gap:6px;
    overflow-y:auto;
    max-height:calc(100vh - 420px);
    min-height:120px;
    padding-right:2px;
  }
  .record-item{
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    padding:9px 10px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .record-item:hover{border-color:var(--amber);}
  .record-item.active{border-color:var(--amber);background:rgba(226,161,58,.09);}
  .record-item .ri-main{font-size:12.5px;line-height:1.5;}
  .record-item .ri-main b{color:var(--off-white);display:block;font-size:13px;}
  .record-item .ri-main span{color:#8f9599;}
  .record-item .ri-del{
    background:none;border:none;color:#6d747a;cursor:pointer;font-size:15px;line-height:1;padding:2px;
  }
  .record-item .ri-del:hover{color:var(--danger);}
  .empty-note{font-size:12px;color:#6d747a;padding:10px 2px;line-height:1.6;}
  .record-group{display:flex;flex-direction:column;gap:6px;}
  .record-group-header{
    font-size:11px;
    letter-spacing:.08em;
    color:var(--amber);
    font-weight:600;
    text-transform:uppercase;
    padding:8px 2px 2px 2px;
    border-top:1px solid var(--steel-line);
    margin-top:2px;
  }
  .record-group:first-child .record-group-header{border-top:none;margin-top:0;padding-top:0;}
  .record-group-header .rg-count{color:#8f9599;font-weight:500;text-transform:none;letter-spacing:0;margin-left:4px;}
  .record-group-header{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;position:relative;}
  .dry-clean-wrap{
    position:relative;
    margin-left:auto;
    display:inline-flex;
  }
  .dry-clean-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:600;text-transform:none;letter-spacing:0;
    padding:3px 8px;border-radius:20px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--steel-line);
    color:#9aa1a6;
    cursor:default;
    white-space:nowrap;
  }
  .dry-clean-badge::before{content:'💧';font-size:10px;}
  .dry-clean-badge.all-done{border-color:var(--teal);color:#7fd8c9;}
  .dry-clean-badge.has-undone{border-color:var(--danger);color:#ff9a8f;}
  .dry-clean-tooltip{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    width:250px;
    max-height:220px;
    overflow-y:auto;
    background:var(--steel-2);
    border:1px solid var(--steel-line);
    border-radius:6px;
    box-shadow:0 12px 32px rgba(0,0,0,.5);
    padding:10px;
    z-index:40;
    opacity:0;
    visibility:hidden;
    transform:translateY(-4px);
    transition:opacity .12s ease, transform .12s ease, visibility .12s;
    text-transform:none;letter-spacing:0;
  }
  .dry-clean-wrap:hover .dry-clean-tooltip,
  .dry-clean-wrap:focus-within .dry-clean-tooltip{
    opacity:1;visibility:visible;transform:translateY(0);
  }
  .dc-tooltip-title{
    font-size:10.5px;color:#9aa1a6;font-weight:600;
    margin-bottom:7px;padding-bottom:7px;
    border-bottom:1px solid var(--steel-line);
    line-height:1.5;
  }
  .dc-lot-item{
    display:flex;align-items:flex-start;gap:4px;
    padding:5px 2px;
    border-radius:3px;
  }
  .dc-lot-item:hover{background:rgba(255,255,255,.04);}
  .dc-lot-check{
    display:flex;align-items:flex-start;gap:7px;
    cursor:pointer;
    flex:1;min-width:0;
  }
  .dc-lot-item input[type="checkbox"]{
    margin-top:2px;width:13px;height:13px;accent-color:var(--teal);cursor:pointer;flex-shrink:0;
  }
  .dc-lot-item input[type="checkbox"]:disabled{cursor:not-allowed;}
  .dc-lot-info{font-size:12px;color:#c7ccd0;line-height:1.4;}
  .dc-lot-info b{color:var(--off-white);font-weight:600;}
  .dc-lot-empty{font-size:11.5px;color:#6d747a;padding:4px 2px;line-height:1.6;}
  .dc-lot-del{
    background:none;border:none;color:#6d747a;cursor:pointer;
    font-size:13px;line-height:1;padding:2px 3px;flex-shrink:0;border-radius:3px;
  }
  .dc-lot-del:hover{color:var(--danger);}
  .dc-lot-del:disabled{opacity:.4;cursor:not-allowed;}
  .device-status-line{
    display:flex;flex-wrap:wrap;gap:4px 10px;
    padding:2px 2px 8px 2px;
    text-transform:none;letter-spacing:0;
  }
  .device-status-item{font-size:11.5px;font-weight:500;}
  .device-status-item .dev-name{color:#c7ccd0;margin-right:3px;}
  .device-status-item .dev-flag{font-weight:700;}
  .device-status-item .dev-flag.done{color:#3fd67a;}
  .device-status-item .dev-flag.undone{color:#ff4d4d;}
  .clean-booth-line{padding:0 2px 4px 2px;text-transform:none;letter-spacing:0;}
  .clean-booth-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:600;
    padding:3px 8px;border-radius:20px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--steel-line);
    color:#9aa1a6;
    white-space:nowrap;
  }
  .clean-booth-badge::before{content:'🧼';font-size:10px;}
  .clean-booth-badge.used{border-color:var(--amber);color:var(--amber);}
  .clean-booth-badge.unused{color:#6d747a;}

  .sidebar-foot{margin-top:auto;font-size:11px;color:#6d747a;line-height:1.6;border-top:1px solid var(--steel-line);padding-top:12px;}

  /* ---------- MAIN ---------- */
  .main{padding:26px 34px 60px 34px;overflow-x:auto;}
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:flex-end;
    background:var(--steel-2);
    border:1px solid var(--steel-line);
    border-radius:4px;
    padding:18px 20px;
    margin-bottom:22px;
  }
  .tb-field{display:flex;flex-direction:column;gap:5px;}
  .tb-field label{font-size:11px;color:#9aa1a6;font-weight:500;letter-spacing:.02em;}
  .tb-field select, .tb-field input{
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    padding:9px 10px;
    font-size:13.5px;
    min-width:110px;
  }
  .tb-field input.wide{min-width:170px;}
  .tb-field .tb-fixed-display{
    background:var(--steel-1);
    border:1px solid var(--steel-line);
    border-radius:3px;
    color:var(--off-white);
    padding:9px 10px;
    font-size:13.5px;
    min-width:170px;
    display:flex;
    align-items:center;
    user-select:none;
    cursor:default;
  }
  .tb-field .tb-fixed-display.is-empty{color:#6d747a;}
  .tb-spacer{flex:1;}
  .status-chip{
    font-size:11.5px;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--steel-line);
    color:#9aa1a6;
  }
  .status-chip.dirty{border-color:var(--amber);color:var(--amber);}
  .status-chip.saved{border-color:var(--teal);color:#7fd8c9;}

  /* paper ledger */
  .ledger-wrap{
    background:var(--paper);
    border-radius:4px;
    border:1px solid var(--paper-line);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    color:var(--ink);
    overflow:hidden;
  }
  .ledger-title-bar{
    background:var(--paper-2);
    border-bottom:2px solid var(--ink);
    padding:18px 22px 14px 22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:10px;
  }
  .ledger-title-bar h2{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    margin:0;
    letter-spacing:.02em;
  }
  .ledger-meta{
    font-family:'Roboto Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .ledger-info-row{
    display:flex;
    border-bottom:1px solid var(--paper-line);
    font-size:13px;
  }
  .info-cell{
    padding:9px 14px;
    border-right:1px solid var(--paper-line);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .info-cell:last-child{border-right:none;flex:1;}
  .info-cell .lbl{font-weight:700;color:var(--ink-soft);white-space:nowrap;font-size:12px;}
  .info-cell .val{font-weight:500;}

  table.grid{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.grid thead th{
    background:var(--ink);
    color:var(--off-white);
    font-family:'Oswald',sans-serif;
    font-weight:500;
    letter-spacing:.02em;
    padding:9px 6px;
    border-right:1px solid #3a342a;
    font-size:12.5px;
    position:sticky;top:0;
  }
  table.grid tbody td{
    border-bottom:1px solid var(--paper-line);
    border-right:1px solid var(--paper-line);
    padding:0;
  }
  table.grid tbody tr:nth-child(even){background:rgba(0,0,0,.02);}
  table.grid td input{
    width:100%;
    border:none;
    background:transparent;
    padding:8px 8px;
    font-size:13px;
    color:var(--ink);
    outline:none;
    font-family:'Noto Sans KR',sans-serif;
  }
  table.grid td input:focus{background:rgba(226,161,58,.16);}
  table.grid td select.cell-select{
    width:100%;
    border:none;
    background:transparent;
    padding:8px 6px;
    font-size:13px;
    color:var(--ink);
    outline:none;
    font-family:'Noto Sans KR',sans-serif;
  }
  table.grid td select.cell-select:focus{background:rgba(226,161,58,.16);}
  td.sign-cell{padding:4px 6px;text-align:center;}
  .sign-btn{
    border:1px solid var(--teal-dark);
    background:#eef6f4;
    color:var(--teal-dark);
    font-size:12px;
    font-weight:600;
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .sign-btn:hover{background:var(--teal);color:#fff;}
  .sign-filled{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    color:var(--ink);
  }
  .sign-filled .sign-name{
    font-family:'Oswald',sans-serif;
    letter-spacing:.01em;
  }
  .sign-filled .sign-cancel{
    border:none;background:none;color:#a68f6a;cursor:pointer;font-size:12px;padding:0 2px;
  }
  .sign-filled .sign-cancel:hover{color:var(--danger);}
  .sign-note{
    font-size:11px;
    color:var(--ink-soft);
    font-style:italic;
  }
  table.grid td.col-date input, table.grid td.col-time input{font-family:'Roboto Mono',monospace;}
  table.grid td.col-time input{text-align:center;}
  td.col-mfg{padding:0;}
  .mfg-wrap{display:flex;flex-direction:column;}
  .mfg-wrap select.mfg-select{
    width:100%;border:none;background:transparent;
    padding:5px 6px 2px 6px;font-size:11.5px;color:var(--ink-soft);outline:none;
    font-family:'Noto Sans KR',sans-serif;border-bottom:1px dashed var(--paper-line);
  }
  .mfg-wrap input.mfg-num{
    width:100%;border:none;background:transparent;
    padding:4px 6px 6px 6px;font-size:13px;color:var(--ink);outline:none;
    font-family:'Roboto Mono',monospace;
  }
  .mfg-wrap select.mfg-select:focus, .mfg-wrap input.mfg-num:focus{background:rgba(226,161,58,.16);}
  td.col-del{text-align:center;width:34px;}
  td.col-del button{
    border:none;background:none;color:#a68f6a;cursor:pointer;font-size:16px;
  }
  td.col-del button:hover{color:var(--danger);}

  .grid-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    background:var(--paper-2);
    border-top:1px solid var(--paper-line);
    flex-wrap:wrap;
    gap:10px;
  }
  .grid-actions .left-actions{display:flex;gap:8px;}
  .link-btn{
    background:none;border:none;color:var(--teal-dark);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;
  }

  .footer-block{
    display:grid;
    grid-template-columns:1.4fr .8fr .8fr;
    border-top:2px solid var(--ink);
  }
  .footer-cell{
    border-right:1px solid var(--paper-line);
    padding:10px 14px 14px 14px;
  }
  .footer-cell:last-child{border-right:none;}
  .footer-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.05em;
    margin-bottom:6px;

const LOCATION_CODES = [

  'C383RE': ['RS-302','RG-203','NF-104','VD-102']  // O0330A6RE와 동일 기기
};
const PRODUCT_CODES = Object.keys(PRODUCT_DEVICE_MAP);

// 품목명(sel-product) 드롭다운에는 아래 7가지 대표 코드만 표시
// (RE/A6RE 등 세부 제조번호 코드는 각 대표 코드에 속한 그룹으로 묶어서
//  제조번호 입력 시에만 선택할 수 있도록 함)
const BASE_PRODUCTS = ['G0720','O0830','LX0566','LX0556','O0711','O0731','O0330'];

// 대표 품목명 -> 실제 제조번호에 쓰이는 세부 품목코드 목록
const BASE_TO_CODES = {
  'O0711': ['O0711A6RE','O0711RE','GP-A079RE'],
  'G0720': ['G0720A6RE','G0720RE'],
  'O0830': ['O0830A6RE','O0830RE','HTM-K940RE'],
  'O0731': ['O0731RE','O0731A6RE','LHT-6634RE'],
  'LX0566': ['LX0566A6RE','LX0566RE'],
  'LX0556': ['LX0556A6RE','LX0556RE'],
  'O0330': ['O0330A6RE','O0330RE','C383RE']
};

// 대표 품목명 -> 사용하는 기기명 목록(반응기/여과기/건조기)
const BASE_TO_DEVICES = {
  'O0711': ['RS-201','NF-102','VD-101'],
  'G0720': ['RS-205','NF-105','VD-202'],
  'O0830': ['RS-202','NF-103','VD-104'],
  'O0731': ['RG-205','NF-101','VD-103'],
  'LX0566': ['RS-301','NF-201','VD-201'],
  'LX0556': ['RS-204','NF-106','VD-105'],
  'O0330': ['RS-302','RG-203','NF-104','VD-102']
};

// 기기명 -> 대표 품목명 역참조
const DEVICE_TO_BASE_PRODUCT = {};
Object.entries(BASE_TO_DEVICES).forEach(([base, devices])=>{
  devices.forEach(dv => { DEVICE_TO_BASE_PRODUCT[dv] = base; });
});

// 기기명 -> 설치장소 고정값 (수정 불가, 기기 선택 시 자동 입력)
const DEVICE_LOCATION_MAP = {
  'RS-201':'합성동 2층','RS-202':'합성동 2층','RG-203':'합성동 2층','RS-204':'합성동 2층','RS-205':'합성동 2층','RG-206':'합성동 2층',
  'RS-301':'합성동 3층','RS-302':'합성동 3층',
  'NF-101':'합성동 1층','NF-102':'합성동 1층','NF-103':'합성동 1층','NF-104':'합성동 1층','NF-105':'합성동 1층','NF-106':'합성동 1층',
  'NF-201':'합성동 2층','NF-202':'합성동 2층',
  'VD-101':'건조실1','VD-102':'건조실2','VD-103':'건조실3','VD-104':'건조실4','VD-105':'건조실5',
  'VD-201':'건조실2층1','VD-202':'건조실2층2',
  'RG-205':'합성동 2층'
};

// RS/RG=반응기(정제), NF=여과기(여과), VD=건조기(건조) + CS
const DEVICE_PROCESS_MAP = {
  'RS-201':['정제','CS'],'RS-202':['정제','CS'],'RG-203':['정제','CS'],
  'RS-204':['정제','CS'],'RS-205':['정제','CS'],'RG-206':['정제','CS'],
  'RS-301':['정제','CS'],'RS-302':['정제','CS'],'RG-205':['정제','CS'],
  'NF-101':['여과','CS'],'NF-102':['여과','CS'],'NF-103':['여과','CS'],
  'NF-104':['여과','CS'],'NF-105':['여과','CS'],'NF-106':['여과','CS'],
  'NF-201':['여과','CS'],'NF-202':['여과','CS'],
  'VD-101':['건조','CS'],'VD-102':['건조','CS'],'VD-103':['건조','CS'],
  'VD-104':['건조','CS'],'VD-105':['건조','CS'],
  'VD-201':['건조','CS'],'VD-202':['건조','CS']
};

function processesForDevice(device){
  if(DEVICE_PROCESS_MAP[device]) return DEVICE_PROCESS_MAP[device];
  if(/^RS-|^RG-/.test(device||'')) return ['정제','CS'];
  if(/^NF-/.test(device||'')) return ['여과','CS'];
  if(/^VD-/.test(device||'')) return ['건조','CS'];
  return [];
}

const WORKER_CODES = ['ajtwh7481','psw','khd4323','leel119'];
const MANAGER_CODES = ['leel119','khd4323']; // 담당자: 김봉수, 김희두
const APPROVER_CODES = ['ccs']; // 승인자: 최창식
const CHECKER_CODES = ['ajtwh7481','psw','khd4323','leel119']; // 확인자(표 내 서명): 작업자 4명(조권희,박상욱,김희두,김봉수)과 동일. 같은 행에서 작업자 본인은 renderCheckerCell 로직에서 자동 제외되므로 실제로는 4명 중 3명만 서명 가능

function canSelectManager(){
  return !!currentUser && MANAGER_CODES.includes(currentUser);
}
function canSelectApprover(){
  return !!currentUser && APPROVER_CODES.includes(currentUser);
}
function canSelectChecker(){
  return !!currentUser && CHECKER_CODES.includes(currentUser);
}
function canSelectWorker(){
  return !!currentUser && WORKER_CODES.includes(currentUser);
}

// 아이디 -> 표시 이름
const USER_NAMES = {
  'leel119':'김봉수',
  'ccs':'최창식',
  'khd4323':'김희두',
  'psw':'박상욱',
  'ajtwh7481':'조권희'
};
function displayName(code){
  return USER_NAMES[code] || code || '';
}

function blankRow(){
  return { date:'', timeStart:'', timeEnd:'', mfgNo:'', process:'', worker:'', checker:'', note:'' };
}

// 행이 실제로 바뀌었는지 비교하기 위한 "정규화된 서명" 문자열.
// 화면에 보이는 8개 필드만, 항상 같은 순서로 뽑아서 비교한다.
// (예전 데이터에 남아있는 'time' 같은 숨은 필드나, 속성이 저장/로드되는
//  순서 차이 때문에 실제로는 안 바뀐 행이 "수정됨"으로 잘못 잡히는 것을 방지)
const ROW_COMPARE_FIELDS = ['date','timeStart','timeEnd','mfgNo','process','worker','checker','note'];

// 행의 비교 대상 필드들을 필드별로 정리한 스냅샷(공백은 정리해서 저장)
function rowFieldSnapshot(r){
  const snap = {};
  ROW_COMPARE_FIELDS.forEach(f => { snap[f] = String(r[f] || '').trim(); });
  return snap;
}

// 저장 시 "수정 사유"를 물어야 하는 변경인지 판단.
// - 예전에 값이 있었는데(oldV !== '') 다른 값으로 바뀌거나 지워진 경우만 "수정"으로 본다.
// - 빈 칸이었다가 처음 값을 채워 넣은 경우(oldV === '')는 새로 기록한 것이므로 수정 사유를 묻지 않는다.
function rowHasReasonWorthyChange(oldSnap, rowObj){
  return ROW_COMPARE_FIELDS.some(f=>{
    const oldV = oldSnap[f];
    const newV = String(rowObj[f] || '').trim();
    return oldV !== '' && oldV !== newV;
  });
}

// 날짜: 숫자만 입력해도 자동으로 점(.)을 넣어줌 (예: 260801 -> 2026.08.01)
// 앞 2자리는 연도(YY)로 보고 "20"을 자동으로 붙여 4자리 연도로 완성한다.
// 화면에 보이는(점과 "20"이 이미 섞여 있는) 문자열을 다시 파싱해서 되돌리면
// 백스페이스로 지울 때 "20"까지 실제 입력값처럼 섞여 날짜가 깨지는 문제가 있었다.
// 그래서 사용자가 실제로 타이핑한 숫자(와 "~")만 input 엘리먼트의 dataset.raw에
// 별도로 저장해두고, 화면 표시는 그 raw 값으로부터 매번 새로 만든다(원본은 절대
// 화면 문자열을 역파싱하지 않음).
// "~"로 기간을 이어 쓰는 경우(예: 2026.0801~0803)도 각 구간을 따로 포맷한다:
// 물결표 앞은 년월일(YYYY.MM.DD), 물결표 뒤 구간들은 월일(MM.DD)로 취급한다.
function formatDateSegment(rawDigits){
  const digits = String(rawDigits||'').replace(/[^\d]/g,'').slice(0,6);
  if(digits.length <= 2) return digits;
  if(digits.length <= 4) return `${digits.slice(0,2)}.${digits.slice(2)}`;
  return `20${digits.slice(0,2)}.${digits.slice(2,4)}.${digits.slice(4,6)}`;
}
function formatMonthDaySegment(rawDigits){
  const digits = String(rawDigits||'').replace(/[^\d]/g,'').slice(0,4);
  if(digits.length <= 2) return digits;
  return `${digits.slice(0,2)}.${digits.slice(2)}`;
}
// raw(사용자가 실제 타이핑한 숫자+"~" 문자열) -> 화면에 보여줄 포맷된 문자열
function formatDateFromRaw(raw){
  const parts = String(raw||'').split('~');
  return [formatDateSegment(parts[0]), ...parts.slice(1).map(formatMonthDaySegment)].join('~');
}
// 이미 저장되어 화면에 표시된 값(예: "2026.08.01" 또는 불러온 기존 데이터)에서
// 편집을 이어갈 수 있도록, 최초 1회에 한해 raw 값을 역으로 복원한다.
// (이 시점의 문자열은 아직 사용자가 손대지 않은 "확정된" 값이므로 안전하게 파싱 가능)
function deriveRawFromFormatted(formattedStr){
  if(!formattedStr) return '';
  const segments = String(formattedStr).split('~');
  const first = segments[0].replace(/\./g,'');
  const firstRaw = first.length >= 8 ? first.slice(2,8) : first.slice(0,6);
  const rest = segments.slice(1).map(s=> s.replace(/\./g,'').slice(0,4));
  return [firstRaw, ...rest].join('~');
}

// 시간: 숫자만 입력해도 자동으로 콜론(:)을 넣어줌 (예: 0930 -> 09:30)
function autoFormatTime(value){
  if(/[^\d:]/.test(value)) return value;
  const digits = value.replace(/:/g,'').slice(0,4);
  if(digits.length <= 2) return digits;
  return `${digits.slice(0,2)}:${digits.slice(2)}`;
}

function sanitize(str){
  return String(str||'').trim().replace(/\s+/g,'_').replace(/[^\w가-힣_-]/g,'');
}

function makeSheetId(year, month, device, location){
  return `${year}-${String(month).padStart(2,'0')}__${sanitize(device)}__${sanitize(location)}`;
}

/* ============================================================
   STORAGE LAYER
   - Inside Claude.ai artifact preview: uses window.storage (shared
     across everyone who opens this artifact there).
   - As a standalone downloaded .html file (double-clicked / hosted
     on a server): window.storage does not exist, so this falls
     back to the browser's localStorage. In that mode, data is only
     stored on that one computer/browser, not shared across devices.
============================================================ */
const LS_PREFIX = 'eqlog__';
let storageModeNotified = false;
let useServerApi = false;
let serverShareUrls = [];

function hasArtifactStorage(){
  return typeof window.storage !== 'undefined'
      && window.storage
      && typeof window.storage.get === 'function';
}

function storageModeLabel(){
  if(useServerApi) return 'server';
  if(hasArtifactStorage()) return 'artifact';
  return 'local';
}

async function initStorageBackend(){
  if(location.protocol === 'file:'){
    useServerApi = false;
    serverShareUrls = [];
    return;
  }
  try{
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), 3000) : null;
    const r = await fetch('/api/health', ctrl ? { signal: ctrl.signal } : {});
    if(timer) clearTimeout(timer);
    useServerApi = r.ok;
    if(r.ok){
      const info = await r.json();
      serverShareUrls = info.shareUrls || [];
    }
  }catch(e){
    useServerApi = false;
    serverShareUrls = [];
  }
}

async function apiJson(path, opts={}){
  const r = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  if(!r.ok) throw new Error('API ' + r.status);
  return r.json();
}

function notifyStorageMode(){
  if(storageModeNotified) return;
  storageModeNotified = true;
  const mode = storageModeLabel();
  if(mode === 'local'){
    console.info('[기기가동 기록서] 독립 실행: 이 PC 브라우저에만 저장됩니다. 회사 공유는 시작.bat 서버로 접속하세요.');
  } else if(mode === 'server'){
    console.info('[기기가동 기록서] 회사 공유망 서버 연결됨.');
  }
}

function updateModeBadge(){
  const badge = document.getElementById('mode-badge');
  if(!badge) return;
  const mode = storageModeLabel();
  if(mode === 'server'){
    badge.textContent = '공유 서버 연결됨';
    badge.className = 'mode-badge server';
  } else if(mode === 'local'){
    badge.textContent = '단독 실행 (공유 안 됨)';
    badge.className = 'mode-badge local';
  } else {
    badge.textContent = '공유 저장소';
    badge.className = 'mode-badge';
  }
}

async function stGet(key, shared){
  notifyStorageMode();
  if(useServerApi){
    try{
      const data = await apiJson('/api/kv/' + encodeURIComponent(key));
      if(data.value === null || data.value === undefined) return null;
      return { key, value: data.value, shared: !!shared };
    }catch(e){ return null; }
  }
  if(hasArtifactStorage()){
    try{ return await window.storage.get(key, shared); }
    catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw===null ? null : {key, value:raw, shared:!!shared};
  }catch(e){ return null; }
}
async function stSet(key, value, shared){
  notifyStorageMode();
  if(useServerApi){
    try{
      await apiJson('/api/kv/' + encodeURIComponent(key), {
        method: 'PUT',
        body: JSON.stringify({ value }),
      });
      return { key, value, shared: !!shared };
    }catch(e){ return null; }
  }
  if(hasArtifactStorage()){
    try{ return await window.storage.set(key, value, shared); }
    catch(e){ return null; }
  }
  try{
    localStorage.setItem(LS_PREFIX+key, value);
    return {key, value, shared:!!shared};
  }catch(e){ return null; }
}
async function stDelete(key, shared){
  notifyStorageMode();
  if(useServerApi){
    try{
      await apiJson('/api/kv/' + encodeURIComponent(key), { method: 'DELETE' });
      return { key, deleted: true, shared: !!shared };
    }catch(e){ return null; }
  }
  if(hasArtifactStorage()){
    try{ return await window.storage.delete(key, shared); }
    catch(e){ return null; }
  }
  try{
    localStorage.removeItem(LS_PREFIX+key);
    return {key, deleted:true, shared:!!shared};
  }catch(e){ return null; }
}

// 해당 품목그룹의 건조기(VD-xxx) 기록에서, 제조번호(로트번호)가 이전 행과
// 달라지는 시점마다 하나의 "로트 변경 이벤트"로 뽑아낸다.
// (건조실은 로트가 바뀔 때마다 청소일지를 새로 작성해야 하므로, 그 시점마다
//  작성 여부를 따로 체크할 수 있게 하기 위함)
async function computeGroupLots(productKey, year, month){
  const devices = (BASE_TO_DEVICES[productKey] || []).filter(d => /^VD-/.test(d));
  if(!devices.length) return [];
  const lots = [];
  for(const device of devices){
    const meta = sheetIndex.find(s => s.year===year && s.month===month && s.device===device);
    if(!meta) continue;
    const data = await loadSheetById(meta.id);
    if(!data || !Array.isArray(data.rows)) continue;
    let prev = '';
    let occ = 0;
    data.rows.forEach(r=>{
      const v = String((r && r.mfgNo) || '').trim();
      if(v && v !== prev){
        occ++;
        lots.push({ device, mfgNo: v, date: String((r && r.date)||'').trim(), eventKey: `${device}__${v}__${occ}` });
      }
      if(v) prev = v;
    });
  }
  return lots;
}

async function loadSheetIndex(){
  const r = await stGet('sheet-index', true);
  try{ sheetIndex = r ? JSON.parse(r.value) : []; }catch(e){ sheetIndex = []; }

  let changed = false;

  // 구버전 데이터 호환: 품목코드(product)가 비어있는 기록은 기기명으로
  // 대표 품목코드를 역추적해 자동으로 채워준다 (사이드바 "품목코드 미지정" 방지)
  sheetIndex.forEach(s=>{
    if(!s.product && s.device && DEVICE_TO_BASE_PRODUCT[s.device]){
      s.product = DEVICE_TO_BASE_PRODUCT[s.device];
      changed = true;
    }
  });

  // 정리 1: 정식 7가지 품목코드(BASE_PRODUCTS)에 속하지 않는 기록은 삭제
  //         (신규 기록 생성 시엔 항상 이 7개 중에서만 선택 가능하므로, 여기 걸리는
  //          항목은 예전 오류/테스트 데이터로 간주해 제거한다)
  const invalidIds = sheetIndex.filter(s=>!BASE_PRODUCTS.includes(s.product)).map(s=>s.id);
  if(invalidIds.length){
    for(const id of invalidIds){ await deleteSheetById(id); }
    sheetIndex = sheetIndex.filter(s=>!invalidIds.includes(s.id));
    changed = true;
  }

  // 정리 2: 같은 연/월/기기 조합이 중복 저장되어 있으면, 가장 최근에 수정된
  //         기록만 남기고 나머지는 삭제 (기기 위치값이 나중에 바뀌어 같은
  //         연월/기기인데 id가 달라지는 경우 등을 대비)
  const byKey = new Map();
  sheetIndex.forEach(s=>{
    const key = `${s.year}-${s.month}__${s.device}`;
    if(!byKey.has(key)) byKey.set(key, []);
    byKey.get(key).push(s);
  });
  const dupIds = [];
  byKey.forEach(list=>{
    if(list.length > 1){
      list.sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
      list.slice(1).forEach(s=>dupIds.push(s.id));
    }
  });
  if(dupIds.length){
    for(const id of dupIds){ await deleteSheetById(id); }
    sheetIndex = sheetIndex.filter(s=>!dupIds.includes(s.id));
    changed = true;
  }

  // 정리 3(1회성 마이그레이션): 예전에 만들어진 기록(특히 "다음달 기기가동 생성"으로
  // 만들어진 빈 양식)에는 hasData 값이 없다. 사이드바 작성함/미작성 표시가 정확하도록,
  // 실제 시트 내용을 열어 확인한 뒤 hasData 값을 한 번만 채워 넣는다.
  for(const s of sheetIndex){
    if(typeof s.hasData !== 'boolean'){
      const data = await loadSheetById(s.id);
      s.hasData = sheetHasData(data);
      changed = true;
    }
  }

  if(changed) await saveSheetIndex();
}
async function saveSheetIndex(){
  await stSet('sheet-index', JSON.stringify(sheetIndex), true);
}

async function loadSheetById(id){

// 실제로 사람이 내용을 입력했는지 판단 (단순히 시트가 "존재"하는 것과는 다름).
// "다음달 기기가동 생성" 등으로 만들어진 빈 양식은 rows/footer/manager/approver가
// 전부 비어있으므로 여기서 false로 판단되어, 사이드바에 "미작성"으로 표시된다.
function sheetHasData(data){
  if(!data) return false;
  const rows = Array.isArray(data.rows) ? data.rows : [];
  const rowFilled = rows.some(r =>
    ROW_COMPARE_FIELDS.some(f => String((r && r[f]) || '').trim() !== '')
  );
  const metaFilled = String(data.footerNote||'').trim() !== ''
    || String(data.manager||'').trim() !== ''
    || String(data.approver||'').trim() !== '';
  return rowFilled || metaFilled;
}

document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  showLoginError('');
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if(!username || !password){ showLoginError('아이디와 비밀번호를 입력하세요.'); return; }

  const submitBtn = document.querySelector('#login-form button[type="submit"]');
  const restoreLabel = submitBtn.textContent;
  function setLoggingIn(on){
    submitBtn.disabled = on;
    submitBtn.textContent = on ? '로그인 확인 중…' : restoreLabel;
  }

  const users = await loadUsers();

  if(signupMode){
    if(users.some(u=>u.username===username)){
      showLoginError('이미 존재하는 아이디입니다.');
      return;
    }
    users.push({ username, password });
    await saveUsers(users);
    currentUser = username;
    try{ localStorage.setItem(CURRENT_USER_LS_KEY, username); }catch(e){}
    setLoggingIn(true);
    await establishSession();
    setLoggingIn(false);
    enterApp();
    return;
  }

  if(users.length===0){
    showLoginError('등록된 계정이 없습니다. 먼저 관리자 계정을 생성하세요.');
    signupMode = true;
    renderLoginExtras();
    return;
  }
  const found = users.find(u=>u.username===username && u.password===password);
  if(!found){
    showLoginError('아이디 또는 비밀번호가 올바르지 않습니다.');
    return;
  }
  currentUser = username;
  try{ localStorage.setItem(CURRENT_USER_LS_KEY, username); }catch(e){}
  setLoggingIn(true);
  await establishSession();
  setLoggingIn(false);
  enterApp();
});

    ? (serverShareUrls.length
      ? `여러 명 동시 로그인 가능. 접속: ${serverShareUrls[0]}`
      : '여러 명이 동시에 로그인·수정할 수 있습니다.')
    : hasArtifactStorage()
    ? '데이터는 이 아티팩트를 여는 모든 사용자에게 공유됩니다.'
    : '⚠️ 단독 실행: 이 PC에만 저장됩니다. 회사 공유는 시작.bat 서버로 접속하세요.';

  updateReadOnlyUI();
  updateModeBadge();
  if(storageModeLabel() === 'server'){
    toast('서버 연결됨. 여러 명이 동시에 사용할 수 있습니다.');
  } else if(location.protocol === 'file:'){
    toast('⚠️ HTML 직접 실행 중 — 데이터 공유 안 됨. 시작.bat 서버로 접속하세요.', true);
  }

  populateYearMonth();
  populateDeviceLocation();
  await loadSheetIndex();
  await loadDryRoomLog();
  renderRecordList();
}

function locationForDevice(device){
  return DEVICE_LOCATION_MAP[device] || '';
}

// 대표 품목명(7종) 기준으로 기기명 드롭다운을 채움
function populateDeviceLocation(){
  const pSel = document.getElementById('sel-product');
  const dSel = document.getElementById('sel-device');

  pSel.innerHTML = '<option value="">품목명 선택 (전체)</option>' +
    BASE_PRODUCTS.map(c=>`<option value="${c}">${c}</option>`).join('');

  fillDeviceOptions('');

  pSel.onchange = ()=>{
    fillDeviceOptions(pSel.value);
  };
  dSel.onchange = applyDeviceLocation;
}

function applyDeviceLocation(){
  const device = document.getElementById('sel-device').value.trim();
  const location = locationForDevice(device);
  const fixedEl = document.getElementById('sel-location-fixed');
  if(fixedEl){
    if(location){
      fixedEl.textContent = location;
      fixedEl.classList.remove('is-empty');
    } else {
      fixedEl.textContent = fixedEl.dataset.placeholder || '';
      fixedEl.classList.add('is-empty');
    }
  }
  if(currentSheet){
    currentSheet.location = location;
    const locEl = document.getElementById('sheet-location-val');
    if(locEl) locEl.textContent = location || '-';
  }
}

function fillDeviceOptions(productCode){
  const dSel = document.getElementById('sel-device');
  const list = productCode && BASE_TO_DEVICES[productCode]
    ? BASE_TO_DEVICES[productCode]
    : DEVICE_CODES;
  const prevValue = dSel.value;
  dSel.innerHTML = '<option value="">기기명 선택</option>' +
    list.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(list.includes(prevValue)) dSel.value = prevValue;
  applyDeviceLocation();
}

function populateYearMonth(){
  const ySel = document.getElementById('sel-year');
  const mSel = document.getElementById('sel-month');
  const now = new Date();
  const thisYear = now.getFullYear();
  ySel.innerHTML='';
  for(let y=thisYear-2; y<=thisYear+1; y++){
    const opt = document.createElement('option');
    opt.value=y; opt.textContent=y+'년';
    if(y===thisYear) opt.selected=true;
    ySel.appendChild(opt);
  }
  mSel.innerHTML='';
  for(let m=1;m<=12;m++){
    const opt = document.createElement('option');
    opt.value=m; opt.textContent=m+'월';
    if(m===now.getMonth()+1) opt.selected=true;
    mSel.appendChild(opt);
  }
}

/* ============================================================
   기기별 작성 여부 표시 (RS-302 / RG-203 / 여과기 / 건조기 등)
   - 상단 툴바에서 선택된 년/월을 기준으로, 해당 품목 그룹에 속한
     기기들이 그 달 기록을 작성했는지(작성함) 안 했는지(미작성) 판단해
     빨간 글씨로 보여준다.
============================================================ */
// 기기명을 표시용 라벨로 변환: 반응기(RS/RG)는 기기 코드 그대로,
// 여과기(NF)는 "여과기", 건조기(VD)는 "건조기"로 표시
function deviceDisplayLabel(device){
  if(/^NF-/.test(device||'')) return '여과기';
  if(/^VD-/.test(device||'')) return '건조기';
  return device || '';
}

function deviceStatusLineHtml(productKey){
  const devices = BASE_TO_DEVICES[productKey];
  if(!devices || !devices.length) return '';
  const selYear = parseInt(document.getElementById('sel-year').value, 10);
  const selMonth = parseInt(document.getElementById('sel-month').value, 10);
  if(!selYear || !selMonth) return '';
  const writtenDevices = new Set(
    sheetIndex
      .filter(s => s.year === selYear && s.month === selMonth && s.product === productKey && s.hasData)
      .map(s => s.device)
  );
  const items = devices.map(dv=>{
    const done = writtenDevices.has(dv);
    return `<span class="device-status-item">
      <span class="dev-name">${escapeHtml(deviceDisplayLabel(dv))}</span><span class="dev-flag ${done ? 'done' : 'undone'}">${done ? '작성함' : '미작성'}</span>
    </span>`;
  }).join('');
  return `<div class="device-status-line">${items}</div>`;
}

/* ============================================================
   클린부스 사용 여부 표시 (품목코드 기준)
   - 1층 클린부스 사용: O0330, O0711, G0720, O0731
   - 2층 클린부스 사용: LX0566
   - 그 외 전체: 클린부스 미사용
============================================================ */
const CLEAN_BOOTH_1F_PRODUCTS = ['O0330','O0711','G0720','O0731'];
const CLEAN_BOOTH_2F_PRODUCTS = ['LX0566'];

function cleanBoothLineHtml(productKey){
  let label, cls;
  if(CLEAN_BOOTH_1F_PRODUCTS.includes(productKey)){
    label = '클린부스 사용 (1층)';
    cls = 'used';
  }else if(CLEAN_BOOTH_2F_PRODUCTS.includes(productKey)){
    label = '클린부스 사용 (2층)';
    cls = 'used';
  }else{
    label = '클린부스 미사용';
    cls = 'unused';
  }
  return `<div class="clean-booth-line"><span class="clean-booth-badge ${cls}">${label}</span></div>`;
}

/* ============================================================
   RECORD LIST (sidebar)
============================================================ */
async function renderRecordList(filter){
  const list = document.getElementById('record-list');
  const countEl = document.getElementById('record-total-count');
  filter = (filter||'').toLowerCase();
  const items = sheetIndex
    .filter(s => !filter || (s.device||'').toLowerCase().includes(filter) || (s.location||'').toLowerCase().includes(filter))
    .sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));

  if(countEl){
    countEl.textContent = filter
      ? `(검색결과 ${items.length}건 / 전체 ${sheetIndex.length}건)`
      : `(전체 ${sheetIndex.length}건)`;
  }

  if(items.length===0){
    list.innerHTML = `<div class="empty-note">저장된 기록이 없습니다. 상단에서 년/월과 기기 정보를 입력하고 "불러오기 / 새 기록"을 눌러 시작하세요.</div>`;
    return;
  }

  // 품목코드(카테고리)별로 묶기 - BASE_PRODUCTS 순서대로 먼저, 그 외 코드는 뒤에, 미지정은 맨 뒤
  const groupsMap = new Map();
  items.forEach(s=>{
    const key = s.product || '';
    if(!groupsMap.has(key)) groupsMap.set(key, []);
    groupsMap.get(key).push(s);
  });
  const knownOrder = BASE_PRODUCTS.filter(c=>groupsMap.has(c));
  const otherOrder = [...groupsMap.keys()].filter(c=>c && !BASE_PRODUCTS.includes(c)).sort();
  const orderedKeys = [...knownOrder, ...otherOrder, ...(groupsMap.has('')?['']:[])];

  const dcSelYear = parseInt(document.getElementById('sel-year').value, 10);
  const dcSelMonth = parseInt(document.getElementById('sel-month').value, 10);

  // 각 품목그룹마다, 이번 달 건조기 기록에서 로트(제조번호)가 바뀐 시점들을 미리 계산
  const groupLotsMap = new Map();
  for(const key of orderedKeys){
    groupLotsMap.set(key, await computeGroupLots(key, dcSelYear, dcSelMonth));
  }

  list.innerHTML = orderedKeys.map(key=>{
    // 그룹 내부는 대표 품목의 기기 순서(반응기 → 여과기 → 건조기, BASE_TO_DEVICES 순서)대로 정렬하고,
    // 같은 기기 안에서는 최근 수정된 기록이 위로 오도록 함
    const deviceOrder = BASE_TO_DEVICES[key] || [];
    const groupItems = groupsMap.get(key).slice().sort((a,b)=>{
      let ai = deviceOrder.indexOf(a.device); if(ai===-1) ai = deviceOrder.length;
      let bi = deviceOrder.indexOf(b.device); if(bi===-1) bi = deviceOrder.length;
      if(ai !== bi) return ai - bi;
      return (b.updatedAt||'').localeCompare(a.updatedAt||'');
    });
    const label = key ? escapeHtml(key) : '품목코드 미지정';

    const lots = groupLotsMap.get(key) || [];
    const dcPrefix = dryRoomCleanKey(key, dcSelYear, dcSelMonth);
    const doneCount = lots.filter(l => dryRoomCleanLog[dcPrefix+'::'+l.eventKey]).length;
    const totalCount = lots.length;
    const badgeText = totalCount ? `건조실청소 ${doneCount}/${totalCount}` : '건조실청소 (해당없음)';
    const badgeClass = totalCount===0 ? '' : (doneCount===totalCount ? ' all-done' : ' has-undone');
    const tooltipItemsHtml = lots.length ? lots.map(l=>{
      const checked = !!dryRoomCleanLog[dcPrefix+'::'+l.eventKey];
      return `<div class="dc-lot-item">
        <label class="dc-lot-check">
          <input type="checkbox" class="dc-lot-checkbox" data-eventkey="${escapeHtml(l.eventKey)}" data-product="${escapeHtml(key)}" ${checked?'checked':''} ${isReadOnly?'disabled':''}>
          <span class="dc-lot-info"><b>${escapeHtml(l.mfgNo)}</b>${l.date?` · ${escapeHtml(l.date)}`:''}${checked?' · 작성함':' · 미작성'}</span>
        </label>
        ${checked ? `<button type="button" class="dc-lot-del" data-eventkey="${escapeHtml(l.eventKey)}" data-product="${escapeHtml(key)}" title="작성 체크 삭제" ${isReadOnly?'disabled':''}>✕</button>` : ''}
      </div>`;
    }).join('') : `<div class="dc-lot-empty">이번 달 건조기 기록에 제조번호(로트)가 아직 입력되지 않았습니다.</div>`;

    return `
    <div class="record-group">
      <div class="record-group-header">${label}<span class="rg-count">${groupItems.length}건</span>
        <span class="dry-clean-wrap" tabindex="0">
          <span class="dry-clean-badge${badgeClass}">${badgeText}</span>
          <div class="dry-clean-tooltip">
            <div class="dc-tooltip-title">건조실청소일지 작성현황<br>(로트번호가 바뀔 때마다 작성 확인)</div>
            ${tooltipItemsHtml}
          </div>
        </span>
      </div>
      ${cleanBoothLineHtml(key)}
      ${deviceStatusLineHtml(key)}
      ${groupItems.map(s=>`
        <div class="record-item ${s.id===currentSheetId?'active':''}" data-id="${s.id}">
          <div class="ri-main">
            <b>${escapeHtml(s.device)||'(기기명 미입력)'}</b>
            <span>${s.year}년 ${s.month}월 · ${escapeHtml(s.location)||'-'}</span>
          </div>
          <button class="ri-del" data-del="${s.id}" title="삭제">✕</button>
        </div>
      `).join('')}
    </div>`;
  }).join('');

  list.querySelectorAll('.record-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.dataset.del) return;
      openSheet(el.dataset.id);
    });
  });
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(isReadOnly){ toast('보기 전용 모드에서는 삭제할 수 없습니다.', true); return; }
      const id = btn.dataset.del;
      const meta = sheetIndex.find(s=>s.id===id);
      if(!confirm(`"${meta.device} / ${meta.year}년 ${meta.month}월" 기록을 삭제하시겠습니까? 되돌릴 수 없습니다.`)) return;
      await deleteSheetById(id);
      sheetIndex = sheetIndex.filter(s=>s.id!==id);
      await saveSheetIndex();
      if(currentSheetId===id){
        await releaseSheetLock();
        currentSheet = null;
        currentSheetId = null;
        document.getElementById('ledger-area').innerHTML='';
        document.getElementById('bottom-actions').style.display='none';
        document.getElementById('save-btn').style.display='none';
        document.getElementById('sheet-lock-banner').style.display='none';
        document.getElementById('status-chip').textContent='기록을 불러오세요';
        document.getElementById('status-chip').className='status-chip';
      }
      renderRecordList(document.getElementById('record-search-input').value);
      toast('삭제되었습니다.');
    });
  });

  list.querySelectorAll('.dc-lot-checkbox').forEach(cb=>{
    cb.addEventListener('click', (e)=> e.stopPropagation());
    cb.addEventListener('change', async (e)=>{
      if(isReadOnly){
        e.target.checked = !e.target.checked;
        toast('보기 전용 모드에서는 변경할 수 없습니다.', true);
        return;
      }
      const product = e.target.dataset.product;
      const eventKey = e.target.dataset.eventkey;
      const fullKey = dryRoomCleanKey(product, dcSelYear, dcSelMonth) + '::' + eventKey;
      dryRoomCleanLog[fullKey] = e.target.checked;
      const lotItem = e.target.closest('.dc-lot-item');
      const infoSpan = lotItem ? lotItem.querySelector('.dc-lot-info') : null;
      if(infoSpan){
        infoSpan.innerHTML = infoSpan.innerHTML.replace(/ · (작성함|미작성)$/, ` · ${e.target.checked ? '작성함' : '미작성'}`);
      }
      // 체크 여부에 따라 개별 삭제(✕) 버튼도 즉시 추가/제거
      if(lotItem){
        let delBtn = lotItem.querySelector('.dc-lot-del');
        if(e.target.checked && !delBtn){
          delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'dc-lot-del';
          delBtn.title = '작성 체크 삭제';
          delBtn.dataset.eventkey = eventKey;
          delBtn.dataset.product = product;
          delBtn.textContent = '✕';
          bindDcLotDelButton(delBtn);
          lotItem.appendChild(delBtn);
        } else if(!e.target.checked && delBtn){
          delBtn.remove();
        }
      }
      try{
        await saveDryRoomLog();
      }catch(err){
        console.error(err);
        toast('저장 중 오류가 발생했습니다.', true);
        return;
      }
      // 배지(n/m)와 색상도 즉시 갱신
      const wrap = e.target.closest('.dry-clean-wrap');
      const badge = wrap ? wrap.querySelector('.dry-clean-badge') : null;
      if(badge){
        const total = wrap.querySelectorAll('.dc-lot-checkbox').length;
        const done = wrap.querySelectorAll('.dc-lot-checkbox:checked').length;
        badge.textContent = `건조실청소 ${done}/${total}`;
        badge.classList.toggle('all-done', done===total);
        badge.classList.toggle('has-undone', done<total);
      }
    });
  });

  // 개별 삭제(✕) 버튼: 체크되어 "작성함" 상태인 로트 항목의 청소일지 작성 기록을 취소한다.
  function bindDcLotDelButton(btn){
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(isReadOnly){ toast('보기 전용 모드에서는 삭제할 수 없습니다.', true); return; }
      const product = btn.dataset.product;
      const eventKey = btn.dataset.eventkey;
      if(!confirm('이 항목의 건조실청소일지 작성 체크를 삭제하시겠습니까?')) return;
      const fullKey = dryRoomCleanKey(product, dcSelYear, dcSelMonth) + '::' + eventKey;
      delete dryRoomCleanLog[fullKey];
      try{
        await saveDryRoomLog();
      }catch(err){
        console.error(err);
        toast('삭제 중 오류가 발생했습니다.', true);
        return;
      }
      renderRecordList(document.getElementById('record-search-input').value);
      toast('삭제되었습니다.');
    });
  }
  list.querySelectorAll('.dc-lot-del').forEach(bindDcLotDelButton);
}

  renderRecordList(e.target.value);

document.getElementById('sel-year').addEventListener('change', ()=>{
  renderRecordList(document.getElementById('record-search-input').value);
});
document.getElementById('sel-month').addEventListener('change', ()=>{
  renderRecordList(document.getElementById('record-search-input').value);

document.getElementById('delete-all-btn').addEventListener('click', async ()=>{
  if(isReadOnly){ toast('보기 전용 모드에서는 삭제할 수 없습니다.', true); return; }
  if(sheetIndex.length === 0){ toast('삭제할 저장된 기록이 없습니다.', true); return; }

  const count = sheetIndex.length;
  if(!confirm(`저장된 기록 전체 ${count}건을 모두 삭제하시겠습니까?\n\n이 저장소는 모든 사용자가 함께 사용하는 공용 저장소이므로 다른 사람이 작성한 기록도 함께 삭제되며, 되돌릴 수 없습니다.`)) return;

  const typed = prompt('정말로 전체 삭제하려면 아래 칸에 "전체삭제"를 입력하세요.');
  if(typed !== '전체삭제'){ toast('입력이 일치하지 않아 취소되었습니다.', true); return; }

  const ids = sheetIndex.map(s=>s.id);
  for(const id of ids){ await deleteSheetById(id); }
  sheetIndex = [];
  await saveSheetIndex();

  if(currentSheetId){
    await releaseSheetLock();
    currentSheet = null;
    currentSheetId = null;
    document.getElementById('ledger-area').innerHTML='';
    document.getElementById('bottom-actions').style.display='none';
    document.getElementById('save-btn').style.display='none';
    document.getElementById('sheet-lock-banner').style.display='none';
    document.getElementById('status-chip').textContent='기록을 불러오세요';
    document.getElementById('status-chip').className='status-chip';
  }

  renderRecordList(document.getElementById('record-search-input').value);
  toast(`저장된 기록 ${count}건을 모두 삭제했습니다.`);
});

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   LOAD / CREATE SHEET
============================================================ */
document.getElementById('load-btn').addEventListener('click', async ()=>{
  const year = parseInt(document.getElementById('sel-year').value,10);
  const month = parseInt(document.getElementById('sel-month').value,10);
  const product = document.getElementById('sel-product').value.trim();
  const device = document.getElementById('sel-device').value.trim();
  const location = locationForDevice(device) || '미지정';

  if(!device){ toast('기기명을 선택하세요.', true); return; }

  if(isDirty && !confirm('저장하지 않은 변경사항이 있습니다. 계속하시겠습니까?')) return;

  const id = makeSheetId(year, month, device, location);
  await openSheet(id, {year, month, product, device, location});
});

async function openSheet(id, metaIfNew){
  // 이전에 열려있던 다른 기록의 편집 잠금은 여기서 반납
  if(currentSheetId && currentSheetId !== id){
    await releaseSheetLock();
  }

  let data = await loadSheetById(id);
  isEditingExisting = !!data;
  if(!data){
    if(!metaIfNew){
      const meta = sheetIndex.find(s=>s.id===id);
      metaIfNew = meta || {year:'', month:'', product:'', device:'', location:''};
    }
    data = {
      year: metaIfNew.year, month: metaIfNew.month,
      product: metaIfNew.product || '', device: metaIfNew.device, location: metaIfNew.location,
      rows: Array.from({length: DAYS_MIN_ROWS}, blankRow),
      footerNote:'', manager:'', approver:'',
      updatedAt: new Date().toISOString()
    };
  }
  // 구버전 데이터 호환: 품목코드(product)가 비어있으면 기기명으로 대표 품목코드를 역추적해 채워준다
  if(!data.product && data.device && DEVICE_TO_BASE_PRODUCT[data.device]){
    data.product = DEVICE_TO_BASE_PRODUCT[data.device];
    const idxMeta = sheetIndex.find(s=>s.id===id);
    if(idxMeta && !idxMeta.product){
      idxMeta.product = data.product;
      saveSheetIndex();
    }
  }
  currentSheet = data;
  currentSheetId = id;
  // 구버전 데이터 호환: 'time' 필드를 timeStart/timeEnd로 미리 분리해둔다.
  // (이 작업을 렌더링 시점(createRowEl)에서 하면, 스냅샷을 찍은 뒤에 rowObj가
  //  새로 바뀌어서 실제로 사용자가 손대지 않은 행까지 "수정됨"으로 잘못 인식되어
  //  다른 행의 비고란에도 수정 사유가 함께 기록되는 오류가 있었음)
  currentSheet.rows.forEach(r=>{
    if(r.timeStart === undefined || r.timeEnd === undefined){
      const legacy = (r.time || '').split(/[~\-]/);
      r.timeStart = r.timeStart || (legacy[0] ? legacy[0].trim() : '');
      r.timeEnd = r.timeEnd || (legacy[1] ? legacy[1].trim() : '');
    }
  });
  rowSnapshotMap = new Map();
  if(isEditingExisting){
    currentSheet.rows.forEach(r => rowSnapshotMap.set(r, rowFieldSnapshot(r)));
  }

  document.getElementById('sel-year').value = data.year;
  document.getElementById('sel-month').value = data.month;
  document.getElementById('sel-product').value = data.product || '';
  fillDeviceOptions(data.product || '');
  document.getElementById('sel-device').value = data.device;
  // 기기 고정값 우선 — 예: RS-201 → 합성동 2층 (수정 불가)
  data.location = locationForDevice(data.device) || '';
  currentSheet.location = data.location;
  applyDeviceLocation();

  renderLedger();
  document.getElementById('bottom-actions').style.display='flex';
  document.getElementById('save-btn').style.display='inline-flex';
  setDirty(false);
  renderRecordList(document.getElementById('record-search-input').value);
}

function refreshStamp(inputId, value){
  const box = document.getElementById(inputId).parentElement;
  let stamp = box.querySelector('.stamp');
  if(value && !stamp){
    stamp = document.createElement('div');
    stamp.className='stamp';
    stamp.textContent = inputId.includes('approver') ? '승인' : '확인';
    box.appendChild(stamp);
  } else if(!value && stamp){
    stamp.remove();
  }
}

/* ============================================================
   WORKER / CHECKER SIGN CELLS
   - 작업자는 WORKER_CODES(조권희,박상욱,김희두,김봉수) 계정만 서명 가능,
     그 중 로그인한 본인 계정으로만 서명됨 (아이디 저장, 화면엔 이름 표시).
     최창식(ccs)은 WORKER_CODES에 없으므로 표 안 작업자 서명 불가.
   - 확인자는 작업자 서명이 먼저 있어야 하고, 작업자와 다른 계정이면서
     CHECKER_CODES(작업자 4명: 조권희,박상욱,김희두,김봉수)로 로그인해야만 서명 버튼이 활성화됨.
     같은 행에 작업자로 서명한 본인은 확인자로 서명 불가 (최창식은 승인자 전용, 확인자 목록에 없음)
============================================================ */
function renderWorkerCell(td, rowObj, checkerTd){
  td.innerHTML = '';
  td.className = 'sign-cell';

  if(rowObj.worker){
    const wrap = document.createElement('div');
    wrap.className = 'sign-filled';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'sign-name';
    nameSpan.textContent = displayName(rowObj.worker);
    wrap.appendChild(nameSpan);

    if(!isEditBlocked() && currentUser === rowObj.worker){
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'sign-cancel';
      cancelBtn.textContent = '✕';
      cancelBtn.title = '서명 취소';
      cancelBtn.addEventListener('click', ()=>{
        if(rowObj.checker){
          toast('확인자 서명이 이미 있어 작업자 서명을 취소할 수 없습니다. 확인자 서명을 먼저 취소하세요.', true);
          return;
        }
        rowObj.worker = '';
        setDirty(true);
        renderWorkerCell(td, rowObj, checkerTd);
        renderCheckerCell(checkerTd, rowObj, td);
      });
      wrap.appendChild(cancelBtn);
    }
    td.appendChild(wrap);
  } else if(isEditBlocked()){
    const note = document.createElement('span');
    note.className = 'sign-note readonly-note';
    note.textContent = '미서명';
    td.appendChild(note);
  } else if(!canSelectWorker()){
    const note = document.createElement('span');
    note.className = 'sign-note';
    note.textContent = '작업자로 서명 가능한 계정이 아닙니다.';
    td.appendChild(note);
  } else {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sign-btn';
    btn.textContent = '서명';
    btn.addEventListener('click', ()=>{
      if(!currentUser) return;
      if(!canSelectWorker()){ toast('작업자로 서명 가능한 계정이 아닙니다.', true); return; }
      rowObj.worker = currentUser;
      setDirty(true);
      renderWorkerCell(td, rowObj, checkerTd);
      renderCheckerCell(checkerTd, rowObj, td);
    });
    td.appendChild(btn);
  }
}

function renderCheckerCell(td, rowObj, workerTd){
  td.innerHTML = '';
  td.className = 'sign-cell';

  if(!rowObj.worker){
    const note = document.createElement('span');
    note.className = 'sign-note';
    note.textContent = '작업자 서명 필요';
    td.appendChild(note);
    return;
  }

  if(rowObj.checker){
    const wrap = document.createElement('div');
    wrap.className = 'sign-filled';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'sign-name';
    nameSpan.textContent = displayName(rowObj.checker);
    wrap.appendChild(nameSpan);

    if(!isEditBlocked() && currentUser === rowObj.checker){
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'sign-cancel';
      cancelBtn.textContent = '✕';
      cancelBtn.title = '서명 취소';
      cancelBtn.addEventListener('click', ()=>{
        rowObj.checker = '';
        setDirty(true);
        renderCheckerCell(td, rowObj, workerTd);
      });
      wrap.appendChild(cancelBtn);
    }
    td.appendChild(wrap);
    return;
  }

  if(isEditBlocked()){
    const note = document.createElement('span');
    note.className = 'sign-note readonly-note';
    note.textContent = '미서명';
    td.appendChild(note);
    return;
  }

  if(currentUser === rowObj.worker){
    const note = document.createElement('span');
    note.className = 'sign-note';
    note.textContent = '다른 계정으로 로그인 후 서명 가능';
    td.appendChild(note);
    return;
  }

  if(!canSelectChecker()){
    const note = document.createElement('span');
    note.className = 'sign-note';
    note.textContent = '확인자로 서명 가능한 계정이 없습니다.';
    td.appendChild(note);
    return;
  }

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'sign-btn';
  btn.textContent = '서명';
  btn.addEventListener('click', ()=>{
    if(!currentUser) return;
    rowObj.checker = currentUser;
    setDirty(true);
    renderCheckerCell(td, rowObj, workerTd);
  });
  td.appendChild(btn);
}

function createRowEl(rowObj){
  const tr = document.createElement('tr');
  const dateTd = document.createElement('td');
  dateTd.className = 'col-date';
  const dateInput = document.createElement('input');
  dateInput.type = 'text';
  dateInput.value = rowObj.date || '';
  dateInput.dataset.raw = deriveRawFromFormatted(rowObj.date || '');
  dateInput.placeholder = '숫자만 입력 (예:260801)';
  dateInput.readOnly = isEditBlocked();
  dateInput.addEventListener('input', (e)=>{
    let raw = dateInput.dataset.raw || '';
    const inputType = e && e.inputType || '';
    if(inputType.indexOf('delete') === 0){
      raw = raw.slice(0, -1);
    } else if(inputType === 'insertFromPaste' || !inputType){
      // 붙여넣기 등 typedChar를 알 수 없는 경우: 현재 화면값에서 숫자/물결표만 추출
      raw = dateInput.value.replace(/[^\d~]/g,'');
    } else {
      const typedChar = (e && e.data != null) ? e.data : dateInput.value.replace(/[^\d~]/g,'').slice(-1);
      if(/^[\d~]$/.test(typedChar)) raw += typedChar;
    }
    // 구간별 자릿수 제한 (첫 구간 6자리 YYMMDD, 이후 구간 4자리 MMDD), 구간 개수 제한
    const parts = raw.split('~').slice(0,4);
    parts[0] = (parts[0]||'').slice(0,6);
    for(let i=1;i<parts.length;i++) parts[i] = parts[i].slice(0,4);
    raw = parts.join('~');
    dateInput.dataset.raw = raw;
    dateInput.value = formatDateFromRaw(raw);
    rowObj.date = dateInput.value;
    setDirty(true);
  });
  dateTd.appendChild(dateInput);
  tr.appendChild(dateTd);

  const startTd = document.createElement('td');
  startTd.className = 'col-time';
  const startInput = document.createElement('input');
  startInput.type = 'text';
  startInput.value = rowObj.timeStart || '';
  startInput.placeholder = '작업시작(예:0930)';
  startInput.readOnly = isEditBlocked();
  startInput.addEventListener('input', ()=>{
    const formatted = autoFormatTime(startInput.value);
    if(formatted !== startInput.value) startInput.value = formatted;
    rowObj.timeStart = startInput.value;
    setDirty(true);
  });
  startTd.appendChild(startInput);
  tr.appendChild(startTd);

  const endTd = document.createElement('td');
  endTd.className = 'col-time';
  const endInput = document.createElement('input');
  endInput.type = 'text';
  endInput.value = rowObj.timeEnd || '';
  endInput.placeholder = '작업종료(예:1730)';
  endInput.readOnly = isEditBlocked();
  endInput.addEventListener('input', ()=>{
    const formatted = autoFormatTime(endInput.value);
    if(formatted !== endInput.value) endInput.value = formatted;
    rowObj.timeEnd = endInput.value;
    setDirty(true);
  });
  endTd.appendChild(endInput);
  tr.appendChild(endTd);

  // 제조번호: 앞부분(품목코드)은 드롭다운으로 선택, 뒷부분(예: 260701)은 직접 입력
  const mfgTd = document.createElement('td');
  mfgTd.className = 'col-mfg';
  const mfgWrap = document.createElement('div');
  mfgWrap.className = 'mfg-wrap';

  const mfgSelect = document.createElement('select');
  mfgSelect.className = 'mfg-select';
  mfgSelect.disabled = isEditBlocked();
  const mfgEmptyOpt = document.createElement('option');
  mfgEmptyOpt.value = '';
  mfgEmptyOpt.textContent = '품목코드 선택';
  mfgSelect.appendChild(mfgEmptyOpt);
  // 현재 기록서의 품목명(대표 코드)과 같은 그룹(같은 기기를 쓰는 품목)만 표시
  // 예: 품목명에서 O0830을 선택하면 제조번호 드롭다운에는
  //     O0830RE / O0830A6RE / HTM-K940RE 만 나타남. 품목명이 지정되지 않은 경우 전체 표시.
  const mfgCurrentProduct = currentSheet ? (currentSheet.product || DEVICE_TO_BASE_PRODUCT[currentSheet.device]) : '';
  const mfgCodeList = (mfgCurrentProduct && BASE_TO_CODES[mfgCurrentProduct]) || PRODUCT_CODES;
  mfgCodeList.forEach(code=>{
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = code;
    mfgSelect.appendChild(opt);
  });

  const mfgNumInput = document.createElement('input');
  mfgNumInput.type = 'text';
  mfgNumInput.className = 'mfg-num';
  mfgNumInput.placeholder = '번호 입력 (예: 260701)';
  mfgNumInput.readOnly = isEditBlocked();

  // 저장된 "품목코드-번호" 문자열을 드롭다운값 / 번호값으로 분리
  function splitMfgNo(value){
    value = value || '';
    const match = PRODUCT_CODES.find(code => value === code || value.startsWith(code + '-'));
    if(match){
      return { code: match, rest: value.slice(match.length).replace(/^-/, '') };
    }
    return { code: '', rest: value };
  }
  const parsedMfg = splitMfgNo(rowObj.mfgNo);
  // 코드가 목록에 없는 옛날 값이면 드롭다운에 임시 옵션으로 추가
  if(parsedMfg.code && !PRODUCT_CODES.includes(parsedMfg.code)){
    const opt = document.createElement('option');
    opt.value = parsedMfg.code;
    opt.textContent = parsedMfg.code;
    mfgSelect.appendChild(opt);
  }
  mfgSelect.value = parsedMfg.code;
  mfgNumInput.value = parsedMfg.rest;

  // 번호칸 자동 채움: 품목코드를 "선택했을 때만"
  // 현재 기록서의 연/월을 "YYMM" 형태(예: 2026년 8월 -> 2608)로 자동으로 미리 채워준다.
  // 7가지 대표 품목(G0720, O0830, LX0566, LX0556, O0711, O0731, O0330)에 속한
  // 모든 세부 품목코드에 동일하게 적용됨. 품목코드를 선택하지 않은 경우에는
  // 자동으로 채우지 않고, 사용자가 직접 입력하도록 둔다.
  // 기록서 자체가 연/월 단위로 새로 만들어지므로, 달이 바뀌면 자동으로 새 접두어가 채워짐.
  const AUTO_MFG_YYMM_CODES = PRODUCT_CODES;
  function autoFillMfgNumIfNeeded(){
    if(isEditBlocked()) return;
    if(mfgNumInput.value) return; // 이미 번호가 입력되어 있으면 건드리지 않음
    if(!AUTO_MFG_YYMM_CODES.includes(mfgSelect.value)) return;
    if(!(currentSheet && currentSheet.year && currentSheet.month)) return;
    const yymmPrefix = String(currentSheet.year).slice(-2) + String(currentSheet.month).padStart(2,'0');
    mfgNumInput.value = yymmPrefix;
    rowObj.mfgNo = `${mfgSelect.value}-${yymmPrefix}`;
  }
  autoFillMfgNumIfNeeded();

  function syncMfgNo(){
    const code = mfgSelect.value;
    const rest = mfgNumInput.value;
    rowObj.mfgNo = code ? `${code}-${rest}` : rest;
    setDirty(true);
  }
  mfgSelect.addEventListener('change', function(){
    autoFillMfgNumIfNeeded();
    syncMfgNo();
  });
  mfgNumInput.addEventListener('input', syncMfgNo);

  mfgWrap.appendChild(mfgSelect);
  mfgWrap.appendChild(mfgNumInput);
  mfgTd.appendChild(mfgWrap);
  tr.appendChild(mfgTd);

  // 작업공정: 기기별 선택 (RS/RG=정제, NF=여과, VD=건조 + CS)
  {
    const td = document.createElement('td');
    const procs = processesForDevice(currentSheet && currentSheet.device);
    const sel = document.createElement('select');
    sel.className = 'cell-select';
    sel.disabled = isEditBlocked();
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = procs.length ? '공정 선택' : '작업공정';
    sel.appendChild(empty);
    procs.forEach(p=>{
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      sel.appendChild(opt);
    });
    if(rowObj.process && !procs.includes(rowObj.process)){
      const opt = document.createElement('option');
      opt.value = rowObj.process;
      opt.textContent = rowObj.process;
      sel.appendChild(opt);
    }
    sel.value = rowObj.process || '';
    sel.addEventListener('change', ()=>{
      rowObj.process = sel.value;
      setDirty(true);
    });
    td.appendChild(sel);
    tr.appendChild(td);
  }

  // 작업자 / 확인자: 직접 서명(로그인 계정) 방식
  // - 작업자가 먼저 서명해야 확인자 서명이 가능
  // - 확인자는 작업자와 다른 계정으로 로그인해야 서명 가능
  const workerTd = document.createElement('td');
  const checkerTd = document.createElement('td');
  renderWorkerCell(workerTd, rowObj, checkerTd);
  renderCheckerCell(checkerTd, rowObj, workerTd);
  tr.appendChild(workerTd);
  tr.appendChild(checkerTd);

  // 비고
  {
    const td = document.createElement('td');
    const input = document.createElement('input');
    input.type='text';
    input.value = rowObj.note || '';
    input.placeholder = '비고';
    input.readOnly = isEditBlocked();
    input.addEventListener('input', ()=>{ rowObj.note = input.value; setDirty(true); });
    td.appendChild(input);
    tr.appendChild(td);
  }

  const delTd = document.createElement('td');
  delTd.className='col-del';
  const delBtn = document.createElement('button');
  delBtn.textContent='✕';
  delBtn.title='행 삭제';
  if(isEditBlocked()) delBtn.disabled = true;
  delBtn.addEventListener('click', ()=>{
    if(isEditBlocked()){ toast('보기 전용 모드에서는 삭제할 수 없습니다.', true); return; }
    if(!confirm('이 행을 삭제하시겠습니까?')) return;
    const idx = currentSheet.rows.indexOf(rowObj);
    if(idx>-1) currentSheet.rows.splice(idx,1);
    tr.remove();
    setDirty(true);
    document.querySelector('.grid-actions div[style]').textContent = `총 ${currentSheet.rows.length}행`;
  });
  delTd.appendChild(delBtn);
  tr.appendChild(delTd);
  return tr;
}

/* ============================================================
   SAVE
============================================================ */
document.getElementById('save-btn').addEventListener('click', async ()=>{
  if(!currentSheet){ toast('먼저 기록을 불러오세요.', true); return; }
  if(isEditBlocked()){ toast('보기 전용 모드에서는 저장할 수 없습니다.', true); return; }

  // 이미 저장된 기록에서, 예전에 값이 있던 필드가 실제로 다른 값으로 바뀌거나 지워진 행이
  // 있으면 수정 사유를 받아 해당 행의 비고란에 기록 (빈칸을 처음 채운 것은 제외)
  if(isEditingExisting){
    const changedRows = currentSheet.rows.filter(r =>
      rowSnapshotMap.has(r) && rowHasReasonWorthyChange(rowSnapshotMap.get(r), r)
    );
    if(changedRows.length > 0){
      const reason = prompt(`${changedRows.length}개 행이 수정되었습니다. 수정 사유를 입력해주세요. (해당 행의 비고란에 기록됩니다)`);
      if(!reason || !reason.trim()){
        toast('수정 사유를 입력해야 저장할 수 있습니다.', true);
        return;
      }
      const now = new Date();
      const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const who = currentUser ? ` / ${displayName(currentUser)}` : '';
      const entry = `[수정 ${stamp}${who}] ${reason.trim()}`;
      changedRows.forEach(r=>{
        r.note = r.note ? `${r.note} / ${entry}` : entry;
      });
      renderLedger();
    }
  }

  currentSheet.year = parseInt(document.getElementById('sel-year').value,10);
  currentSheet.month = parseInt(document.getElementById('sel-month').value,10);
  currentSheet.product = document.getElementById('sel-product').value.trim();
  currentSheet.device = document.getElementById('sel-device').value.trim();
  currentSheet.location = locationForDevice(currentSheet.device) || '';
  currentSheet.updatedAt = new Date().toISOString();

  try{
    await saveSheetById(currentSheetId, currentSheet);
    const metaIdx = sheetIndex.findIndex(s=>s.id===currentSheetId);
    const meta = {
      id: currentSheetId,
      year: currentSheet.year, month: currentSheet.month,
      product: currentSheet.product, device: currentSheet.device, location: currentSheet.location,
      updatedAt: currentSheet.updatedAt,
      hasData: sheetHasData(currentSheet)
    };
    if(metaIdx>-1) sheetIndex[metaIdx] = meta; else sheetIndex.push(meta);
    await saveSheetIndex();
    setDirty(false);
    isEditingExisting = true;
    rowSnapshotMap = new Map();
    currentSheet.rows.forEach(r => rowSnapshotMap.set(r, rowFieldSnapshot(r)));
    renderRecordList(document.getElementById('record-search-input').value);
    toast('저장되었습니다.');
  }catch(e){
    toast('저장 중 오류가 발생했습니다.', true);
  }
});

/* ============================================================
   EXCEL EXPORT (원본 서식(테두리/폰트/정렬) 그대로 유지)
============================================================ */
document.getElementById('download-btn').addEventListener('click', async ()=>{
  if(!currentSheet){ toast('먼저 기록을 불러오세요.', true); return; }
  try{
    const blob = await buildWorkbookBlob(currentSheet);
    const fname = `기기가동기록서_${sanitize(currentSheet.device)||'기기'}_${currentSheet.year}${String(currentSheet.month).padStart(2,'0')}.xlsx`;
    downloadBlob(blob, fname);
    toast('엑셀 파일이 다운로드되었습니다.');
  }catch(e){
    console.error(e);
    toast('엑셀 생성 중 오류가 발생했습니다.', true);
  }
});
